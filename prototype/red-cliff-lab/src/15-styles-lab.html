<style>
/* ===== What-if lab (pairs with 90-whatif-lab.js) ===== */
.wi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wi-card{display:grid;gap:6px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid rgba(236,228,212,.1);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;min-height:96px;align-content:start;transition:border-color .2s,background .2s}
.wi-card:hover{border-color:rgba(232,118,60,.45)}
.wi-card[aria-pressed="true"]{border-color:var(--flame);background:rgba(232,118,60,.08)}
.wi-card b{font-size:15px;line-height:1.45;word-break:keep-all}
.wi-card small{font-size:11.5px;color:var(--ink-3)}
.wi-card.tried small::after{content:" · 해 봄";color:var(--good)}
.wi-kind{font-size:11px;letter-spacing:.08em;color:var(--flame);font-weight:600}
.wi-panel{margin-top:12px;display:grid;gap:10px;animation:fadeup .6s var(--ease-film,ease) both}
.wi-panel h3{font-size:clamp(18px,2vw,22px);word-break:keep-all}
.wi-step{font-size:13px;color:var(--ink-2);margin-top:4px}
.pick.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.wi-meter .pin.ghost{background:rgba(236,230,217,.35);box-shadow:none}
.wi-hit{font-size:14px;color:var(--bad)}.wi-hit.ok{color:var(--good)}
.wi-assume{font-size:13px;color:var(--ink-2);line-height:1.6;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.03)}
.wi-assume b{color:var(--mark);margin-right:6px}
.wi-builder{display:grid;gap:14px}
.wi-builder .ctrls{display:grid;gap:12px}
.wi-question{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,24px);color:#f2e9da;word-break:keep-all;line-height:1.45}
.wi-ask{display:grid;gap:14px}
.wi-ask-row{display:grid;gap:8px}
.wi-ask-row>p:first-child{font-size:15px}
.lab-link{display:grid;gap:4px;padding:18px 20px;margin-top:16px;text-decoration:none;color:var(--ink);border:1px solid rgba(232,118,60,.4);background:rgba(232,118,60,.07);border-radius:var(--r)}
.lab-link b{font-size:17px}.lab-link small{color:var(--ink-2);font-size:13px}
.lab-link.slim{margin-top:10px;padding:14px 16px;grid-template-columns:auto 1fr;align-items:baseline;gap:12px}
.lab-link.slim b{font-size:15px}
.lab-back{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
@media (max-width:900px){.wi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.wi-grid,.pick.three{grid-template-columns:minmax(0,1fr)}.lab-link.slim{grid-template-columns:1fr}}

/* A selected question is the whole experiment view, not a panel below its catalogue. */
.lab-catalog[hidden],#wiPanel[hidden],.lab-choice-nav a[hidden]{display:none!important}
.lab-choice-nav{display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--ink-3);font-size:12px}
.lab-choice-nav>a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--wind)}
#wiPanel .wi-panel{margin:0;padding:25px;display:grid;gap:18px}#wiPanel .wi-step{font-size:17px;font-family:var(--f-display);color:var(--ink)}
.lab-tools{border-top:1px solid var(--rule);padding:16px 0}.lab-tools>summary{cursor:pointer;font-size:13px;color:var(--ink-3);line-height:1.9}.lab-tools[open]{display:grid;gap:20px}.lab-tools:not([open])>.stepsec{display:none}.lab-tools .stepsec{margin-top:20px}
@media(max-width:760px){#wiPanel .wi-panel{padding:20px}.lab-choice-nav{font-size:11px;align-items:flex-start}}
.wi-experiment{display:grid;gap:18px;padding:24px 0;scroll-margin-top:20px}
.wi-experiment[hidden]{display:none!important}
.wi-next{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.experiment-heading>.linkbtn{display:inline-block;margin-bottom:18px}
body.experiment-home #wiPanel{margin-top:12px}
body.experiment-home .lab-tools{margin-top:24px}
.wi-card[hidden]{display:none!important}
/* the question being tested: a quiet title line above the scene, not a button */
.hero-question{justify-self:start;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 2px;text-decoration:none;color:var(--film-ink,#ece6d9);font-family:var(--f-display);font-size:clamp(15px,1.5vw,18px);font-weight:600;letter-spacing:-.005em;line-height:1.4;word-break:keep-all;opacity:.92;transition:opacity .2s;animation:fadeup .8s .05s var(--ease-film,ease) both}
.hero-question span{font-family:var(--f-data,inherit);font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--flame);text-transform:uppercase}
.hero-question:hover{opacity:1}.hero-question:focus-visible{outline:2px solid var(--wind);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.hero-question{animation:none}}
.wi-card{position:relative;padding-right:44px}
.wi-card.current{border-color:var(--flame);box-shadow:inset 3px 0 0 var(--flame)}
.wi-card.finished b{color:var(--ink-2)}
.wi-mark{position:absolute;top:14px;right:14px;font-style:normal;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.wi-mark .ico{width:16px;height:16px;color:var(--good)}
.wi-card.tried small::after{content:none}
/* the lab opens in the same river scene as home: no boxed banner, the cards sit in the night */
.lab-opening{position:relative;isolation:isolate;display:grid;gap:26px;padding:48px 0 28px;background:radial-gradient(ellipse at 70% 60%,rgba(122,48,25,calc(.08 + .14*var(--heat))),transparent 70%)}
.lab-opening>.cinema-bg{position:absolute;inset:-48px -40px -24px;width:calc(100% + 80px);height:calc(100% + 72px);z-index:-1;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 50%,transparent 100%);mask-image:radial-gradient(closest-side,#000 50%,transparent 100%)}
.lab-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.lab-head h1{font-size:clamp(30px,4.6vw,52px);line-height:1.25;color:#f2e9da;word-break:keep-all;text-shadow:0 2px 30px rgba(0,0,0,.6);animation:film-title 1.2s .2s var(--ease-film,ease) both}
.lab-count{font-size:13px;color:var(--ink-3);white-space:nowrap}.lab-count span{color:var(--ink)}
.lab-opening .wi-card{background:rgba(12,16,20,.55);border-color:rgba(236,228,212,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeup .7s var(--ease-film,ease) both}
.lab-opening .wi-card:nth-child(3n+2){animation-delay:.08s}.lab-opening .wi-card:nth-child(3n){animation-delay:.16s}
.lab-opening .wi-card:hover{background:rgba(40,22,14,.6)}
.lab-opening .wi-card.current{background:rgba(48,24,12,.6)}
.lab-tools{border-top:0}
@media (max-width:760px){.lab-opening .wi-card{min-height:0;padding-top:16px;padding-bottom:16px}.lab-opening{padding:30px 0 20px;gap:20px}.lab-opening>.cinema-bg{inset:-32px -16px -16px;width:calc(100% + 32px);height:calc(100% + 48px)}}
@media (prefers-reduced-motion:reduce){.lab-head h1,.lab-opening .wi-card{animation:none}}
</style>
