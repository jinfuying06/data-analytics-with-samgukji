<title>계책록 — 삼국지로 배우는 데이터 분석</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: adaptive analysis workbench, staged as one continuous film scene (single deliberate dark look).
   >=1280: sidebar | main | notebook rail.  1024–1279: sidebar | main, notebook as drawer.  <1024: app bar + bottom tab bar (임무 · 실험실 · 노트).
   Two visual registers: 기록(record) = ink + vermilion seal, 가정(assumption) = wind blue + dashed edges. */
:root{
  --bg:#0a0d10; --panel:#141a1f; --sunk:#1a2127; --sunk-2:#242d34; --ink:#ece4d4; --ink-2:#bdb3a2; --ink-3:#9c9588; --rule:rgba(236,228,212,.11);
  --seal:#e0703a; --seal-bg:rgba(224,112,58,.15); --seal-ink:#170b05;
  --wind:#8fbde8; --wind-bg:rgba(143,189,232,.10); --wind-2:#5f8fbf;
  --mark:#e7b958; --mark-ink:#1d1405;
  --wei:#e8566a; --wu:#8f8cf2; --shu:#6fc98f; --old:#8e9399;
  --good:#8ed6a8; --good-bg:rgba(134,211,163,.10); --bad:#f2b672; --bad-bg:rgba(240,180,110,.11);
  --river:#13212b; --river-2:#1a2e3c; --flame:#ff7a3d; --flame-2:#ffc24f;
  --heat:224,112,58;
  --shadow:0 24px 48px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04);
  --r:8px; --r-sm:6px;
  --f-display:"Hahmlet","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar-h:64px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-width:thin;scrollbar-color:rgba(236,228,212,.22) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wind);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr) 300px;gap:20px;max-width:1480px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 32px;align-items:start}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.sidebar{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));display:grid}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 16px}
.logo{width:40px;height:40px;border-radius:10px;background:url('/images/zhuge-liang-pixel-icon.png') center/cover no-repeat;display:block;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.25}
.brand small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.prog{padding:0 18px 16px;font-size:13px;color:var(--ink-2);display:grid;gap:6px}
.prog .prog-bar{display:block;height:6px;border-radius:3px;background:var(--sunk-2);overflow:hidden}
.prog .prog-bar i{display:block;width:0;height:100%;border-radius:3px;background:var(--seal);transition:width .4s ease-out}
.navgrp{border-top:1px solid var(--rule);padding:10px 10px 12px}
.navgrp>p{font-size:12px;color:var(--ink-3);padding:4px 8px 6px;letter-spacing:.04em}
.navlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlist a{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;min-height:48px;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--ink);transition:background .15s}
.navlist a:hover{background:var(--sunk)}
.navlist a[aria-current="page"]{background:var(--sunk-2)}
.navlist .st{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--rule);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:var(--ink-3);background:var(--panel)}
.navlist a.done .st{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.navlist a.lab .st{border-style:dashed;border-color:var(--wind);color:var(--wind)}
.navlist a.lab.done .st{background:var(--wind);border-style:solid;color:var(--panel)}
.navlist b{display:block;font-size:15px;font-weight:500;line-height:1.3}
.navlist small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.navlist .pill{font-size:11px;color:var(--wind);border:1px solid var(--wind);border-radius:999px;padding:0 7px}
.sidefoot{border-top:1px solid var(--rule);padding:12px 18px 16px;font-size:12px;color:var(--ink-3)}

.notebook{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));max-height:calc(100vh - 40px);overflow:auto}
.nb-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.nb-h h2{font-size:17px}
.nb-h small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.nb-close{display:none}
.notes{list-style:none;margin:0;padding:14px 18px 18px;display:grid;gap:12px}
.notes li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;line-height:1.55}
.notes .nno{width:22px;height:22px;border-radius:6px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-data);font-size:11px;display:grid;place-items:center;margin-top:1px}
.notes li.lab .nno{background:var(--wind);color:var(--panel)}
.notes li.ph{color:var(--ink-3)}
.notes li.ph .nno{background:var(--sunk-2);color:var(--ink-3)}
.notes small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.03em}

/* app bar + tab bar (small screens) */
.appbar,.tabbar,.scrim{display:none}

/* ---------- main ---------- */
.main{display:grid;gap:16px;min-width:0}
.head{padding:18px 22px;display:grid;gap:12px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.crumb{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.reg{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:6px;padding:2px 8px}
.reg.rec{background:var(--seal-bg);color:var(--seal)}
.reg.asm{background:var(--wind-bg);color:var(--wind);border:1px dashed var(--wind)}
.head h1{font-size:clamp(22px,2.4vw,30px);font-weight:800}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.task{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:999px;padding:5px 12px 5px 6px;min-height:30px}
.task .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center}
.task .tk .ico{width:12px;height:12px;stroke-width:3}
.task.ok{color:var(--good);background:var(--good-bg)}
.task.ok .tk{background:var(--good);border-color:var(--good);color:var(--panel)}
.stepper{display:none}

.brief{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;padding:16px 22px}
.face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px;color:#fff;background:var(--c,var(--wu));flex:none}
.brief p{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.6vw,19px);line-height:1.55}
.brief small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px}
.f-cao{--c:#b8323f} .f-jg{--c:#9c3a4a} .f-liu{--c:#2f8a57} .f-sun{--c:#5a55c9} .f-lu{--c:#3f63b0} .f-zhou{--c:#7446b8} .f-huang{--c:#34548f} .f-zhang{--c:#5d5f92}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.cols.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr)}
.cols.one{grid-template-columns:minmax(0,1fr)}
.pane{padding:18px 20px;display:grid;gap:14px;align-content:start;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:28px}
.pane-h h2{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.pane-h h2 .ico{width:18px;height:18px;color:var(--ink-3)}
.pane-h .meta{font-size:12px;color:var(--ink-3)}
.cap{font-size:12px;color:var(--ink-3)}

.source{font-size:18px;line-height:2;background:var(--sunk);border-radius:var(--r-sm);padding:14px 18px}
.source p+p{margin-top:10px}
.source .pno{display:block;font-family:var(--f-data);font-size:11px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.nm{border:0;background:none;padding:2px 3px;border-bottom:1.5px dashed var(--ink-3);border-radius:3px;line-height:1.3;min-height:30px}
.nm:hover{background:var(--sunk-2)}
.nm.on{background:var(--mark);color:var(--mark-ink);border-bottom-color:transparent}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 14px;min-height:40px;font-size:14px;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink-3)}
select,input[type=search]{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;min-height:44px;font-size:15px;color:var(--ink)}
input[type=search]{width:100%}

.tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-sm)}
table.data{border-collapse:collapse;width:100%;font-size:14px}
.data th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;background:var(--sunk);padding:8px 12px;white-space:nowrap;position:sticky;top:0}
.data td{padding:8px 12px;border-top:1px solid var(--rule);white-space:nowrap}
.data td.n,.data th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.data tr.flag td{background:var(--seal-bg)}
.data tr.new td{animation:hl 1.2s ease-out}
@keyframes hl{from{background:var(--mark)}}
.data .chk{width:20px;height:20px;accent-color:var(--seal)}
.data td.dead{color:var(--seal);font-weight:600}
.empty{color:var(--ink-3);font-size:14px;padding:16px;text-align:center}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:4.6em 1fr 3.6em;gap:10px;align-items:center;font-size:14px}
.bar .track{height:18px;background:var(--sunk-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .v{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3)}
.callout{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;background:var(--sunk)}
.callout b{font-family:var(--f-display)}

table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:500px}
.heat th{font-weight:400;font-size:12px;color:var(--ink-3);font-family:var(--f-data)}
.heat tbody th{text-align:left;white-space:nowrap;font-family:var(--f-body);font-size:14px;color:var(--ink);padding-right:4px}
.heat td{padding:0}
.heat td button{display:block;width:100%;height:36px;border:0;border-radius:6px;font-family:var(--f-data);font-size:12px}
.heat td button.zero{background:transparent;outline:1px dashed var(--rule);outline-offset:-1px;color:var(--ink-3)}
.heat td button.sel{box-shadow:0 0 0 2.5px var(--seal)}
.chap{display:grid;gap:6px}
.chap .zh{font-family:var(--f-display);font-size:18px}
.chap p{font-size:15px}

.q{display:grid;gap:12px;padding:18px 22px}
.q h3{font-size:17px}
.q .lead{font-size:13px;color:var(--ink-3)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;text-align:left;background:var(--sunk);border:1.5px solid transparent;border-radius:var(--r-sm);padding:12px 14px;min-height:48px;font-size:15px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--rule)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-family:var(--f-data);font-size:11px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;background:var(--good-bg)}
.fb b{color:var(--good)}
.fb.bad{background:var(--bad-bg)} .fb.bad b{color:var(--bad)}
.q.locked .opts{opacity:.45;pointer-events:none}
.lockline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.q:not(.locked) .lockline{display:none}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:500;background:var(--ink);color:var(--panel);justify-self:start;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--sunk-2);color:var(--ink)}
.btn.wind{background:var(--wind);color:var(--panel)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .ico{width:18px;height:18px}
.pager{display:flex;justify-content:space-between;gap:10px}

.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.book{background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:4px;border-left:4px solid var(--seal);align-content:start}
.book.h{border-left-color:var(--wei)}
.book span{font-size:12px;color:var(--ink-3)}
.book b{font-family:var(--f-display);font-size:16px}
.book p{font-size:14px}

.report{padding:24px 28px;display:grid;gap:14px}
.report .stamp{justify-self:end;width:64px;height:64px;border-radius:12px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;transform:rotate(-6deg)}
.report ol{margin:0;padding-left:20px;display:grid;gap:8px}

/* ---------- lab (assumption register) ---------- */
.asm-banner{display:flex;gap:12px;align-items:center;padding:14px 20px;border:1.5px dashed var(--wind);background:var(--wind-bg);border-radius:var(--r);color:var(--ink)}
.asm-banner .ico{color:var(--wind);width:22px;height:22px}
.asm-banner b{color:var(--wind)}
.card.asm{border:1.5px dashed var(--wind)}
.lever{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--rule)}
.lever:first-of-type{border-top:0;padding-top:0}
.lever-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lever-h b{font-size:15px;font-weight:600}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.src{font-size:11px;border-radius:6px;padding:2px 8px;background:var(--seal-bg);color:var(--seal)}
.lever .changed{font-size:11px;color:var(--wind);font-weight:600}
.range{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--wind);min-height:32px}
.weights{display:grid;gap:8px}
.w{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.stepper-n{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--panel)}
.stepper-n button{width:40px;height:40px;border:0;background:var(--sunk);font-family:var(--f-data);font-size:16px}
.stepper-n output{min-width:3.4em;text-align:center;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:14px}
.formula{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px;background:var(--wind-bg);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;line-height:1.7;overflow-wrap:anywhere}
.formula b{color:var(--wind)}
.scene{border-radius:var(--r-sm);overflow:hidden;background:var(--river)}
.scene svg{display:block;width:100%;height:auto}
.meter{display:grid;gap:6px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-row .big{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1}
.meter-row .verdict{font-family:var(--f-display);font-size:18px;font-weight:600;text-align:right}
.meter .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--wei) 0 35%,var(--sunk-2) 35% 55%,var(--wu) 55% 100%);position:relative;opacity:.9}
.meter .pin{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transition:left .4s cubic-bezier(.2,.7,.2,1)}
.meter .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.cmp{display:grid;gap:8px}
.cmp .bar{grid-template-columns:6.2em 1fr 3em}
.cmp .fill.base{background:var(--ink-3)}
.cmp .fill.mine{background:repeating-linear-gradient(135deg,var(--wind) 0 6px,var(--wind-2) 6px 12px)}
.runs td .tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--wind-bg);color:var(--wind);margin-right:4px}
@keyframes flick{50%{transform:scaleY(.82) translateY(1px)}}
.flame{transform-box:fill-box;transform-origin:bottom center;animation:flick .9s ease-in-out infinite}


/* ---------- cinematic ---------- */
.scene-hero{--film:#0b0f13;--film-2:#151b21;--film-ink:#ece6d9;--film-dim:#a59f93;--ember:#e8763c;
  position:relative;overflow:hidden;border-radius:var(--r);background:radial-gradient(120% 90% at 80% 110%,#2a1a12 0,transparent 55%),linear-gradient(180deg,var(--film-2),var(--film));color:var(--film-ink);min-height:300px;display:grid;align-items:end;box-shadow:0 18px 40px -24px rgba(0,0,0,.6);animation:reveal .9s cubic-bezier(.2,.7,.2,1) both}
.scene-hero[data-fx="mist"]{background:radial-gradient(100% 80% at 20% 0,#1f2c36 0,transparent 60%),linear-gradient(180deg,#141c23,#0a0e12)}
.scene-hero[data-fx="fire"]{background:radial-gradient(90% 80% at 70% 120%,#5a2410 0,transparent 60%),linear-gradient(180deg,#160f0c,#0a0807)}
@keyframes reveal{from{clip-path:inset(46% 0 46% 0)}to{clip-path:inset(0 0 0 0)}}
.scene-hero .fx{position:absolute;inset:0;width:100%;height:100%}
.scene-hero .lb{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 22px 0 #000,inset 0 -22px 0 #000;opacity:.85}
.hero-in{position:relative;padding:44px 40px 40px;display:grid;gap:10px;max-width:880px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:13px;letter-spacing:.08em;color:var(--film-dim)}
.hero-meta .hz{font-family:var(--f-display);font-weight:600;color:var(--ember);letter-spacing:.2em}
.scene-hero h1{font-size:clamp(28px,4.2vw,50px);font-weight:800;letter-spacing:-.01em;color:var(--film-ink);text-shadow:0 2px 24px rgba(0,0,0,.6);animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
