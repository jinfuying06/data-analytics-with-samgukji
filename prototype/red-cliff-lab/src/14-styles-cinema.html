<style>
/* ===== cinema: one look for every page (pairs with 85-cinema.js) ===== */
:root{--ease-film:cubic-bezier(.2,.7,.2,1);--heat:.2}

/* same grade on every stage: night river, ember glow rising with --heat */
.scene-hero,.scene-hero[data-fx]{background:
  radial-gradient(90% 85% at 72% 118%,rgba(120,46,18,calc(.25 + .55*var(--heat))) 0,transparent 62%),
  radial-gradient(80% 70% at 15% -10%,rgba(40,62,78,calc(.75 - .45*var(--heat))) 0,transparent 60%),
  linear-gradient(180deg,#121a21,#090c10)}
.scene-hero h1{word-break:keep-all;animation:film-title 1.2s .25s var(--ease-film) both}
@keyframes film-title{from{opacity:.001;letter-spacing:.12em;filter:blur(6px)}to{opacity:1;letter-spacing:-.01em;filter:blur(0)}}
.scene-hero .hero-meta{animation:fadeup .9s .1s var(--ease-film) both}

/* letterbox bars close in like the opening, then settle */
.scene-hero .lb{box-shadow:none;opacity:1}
.scene-hero .lb::before,.scene-hero .lb::after{content:"";position:absolute;left:0;right:0;height:14px;background:#000;animation:film-bars 1.1s var(--ease-film) both}
.scene-hero .lb::before{top:0}.scene-hero .lb::after{bottom:0}
@keyframes film-bars{from{height:50%}to{height:14px}}

/* the scene frames the title; it should not be taller than it needs */
.scene-hero,.scene-hero[data-fx]{min-height:0}
.scene-hero .hero-in{padding:34px 40px 28px;gap:8px;max-width:none}
.scene-hero h1{font-size:clamp(24px,3vw,38px);line-height:1.3}

.main h1,.main h2,.main h3,.simple-story{word-break:keep-all}

/* scene counter: six frames of film, the current one burning */
.reel{display:flex;gap:5px;margin-bottom:4px}
.reel i{width:22px;height:4px;border-radius:2px;background:rgba(236,230,217,.14)}
.reel i.past{background:rgba(232,118,60,.55)}
.reel i.now{background:var(--flame);box-shadow:0 0 10px rgba(255,122,61,.8)}

/* home: the same river scene behind the question */
.experiment-opening{position:relative;isolation:isolate;background:radial-gradient(ellipse at 75% 55%,rgba(122,48,25,.12),transparent 72%)}
.experiment-opening>.cinema-bg{position:absolute;inset:-48px -40px -24px;width:calc(100% + 80px);height:calc(100% + 72px);z-index:-1;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 45%,transparent 100%)}
.experiment-opening h1{word-break:keep-all;animation:film-title 1.2s .2s var(--ease-film) both}

/* cut between pages: a short fade from black */
#cinema-cut{position:fixed;inset:0;z-index:90;background:#000;pointer-events:none;opacity:0}
#cinema-cut.on{animation:film-cut .55s ease-out both}
@keyframes film-cut{from{opacity:.85}to{opacity:0}}

/* result moments: the box settles in (no decorative lines) */
.named,.big-change,.simple-result,#s6pred>.prediction-review,#allRes{animation:fadeup .7s var(--ease-film) both}

/* home figure: no box of its own; the flags stand in the shared river scene */
.experiment-river{container-type:inline-size;background:none;border:0;box-shadow:none;border-radius:0;padding:0;overflow:visible}
.experiment-river .river-lines{display:none}
.river-caption{color:#a59f93;padding:0 6px}
.river-divider{color:#e8763c;opacity:.85;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.08em;align-self:center;transform:translateY(30px)}
.river-armies{--flag-size:min(156px,calc((100cqw - 34px)/2.65));grid-template-columns:minmax(0,1fr) 34px minmax(0,1.65fr);min-height:250px;align-items:end}
/* One shared frame size for all factions. Normalize transparent sprite margins
   so the visible flag height also matches; stagger the allied flags by only 12px. */
.river-side picture{width:var(--flag-size);height:var(--flag-size);flex:0 0 var(--flag-size)}
.river-side.wei{justify-items:center}
.river-side img{width:100%;height:100%;max-height:none;aspect-ratio:1/1;object-fit:cover;object-position:52% 50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(232,118,60,calc(.1 + .25*var(--heat))))}
.river-side b{margin-top:6px;font-size:13px;color:#ece6d9;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.river-side.wei img{transform:scale(1.055556)}
.alliance-flags{gap:0;margin:0;justify-content:center;min-height:var(--flag-size)}
.alliance-flags picture:first-child{transform:translateY(-6px)}
.alliance-flags picture+picture{margin-left:calc(var(--flag-size)*-.35);transform:translateY(6px)}
.alliance-flags picture+picture img{transform:scale(1.096154)}

/* remove separator lines that carried no meaning; group with surfaces instead */
.experiment-opening{border-bottom:0}
.journey-outline{border:0;background:rgba(255,255,255,.025);border-radius:var(--r);padding:0 16px}
.journey-outline li a{border-top:0}
.prediction-review{border-top:0;background:rgba(255,255,255,.025);border:1px solid rgba(236,228,212,.08);border-radius:var(--r);padding:22px}
.prediction-comparison{border:0;padding:4px 0}
.pcard-tip{border-top:0;padding-top:2px}

/* stage content arrives in the same order every time */
.main.simple>.simple-todo{animation:fadeup .7s .35s var(--ease-film) both}
.main.simple>.stepsec{animation:fadeup .7s .5s var(--ease-film) both}

@media (max-width:760px){.scene-hero .hero-in{padding:26px 18px 20px}.scene-hero h1{font-size:clamp(22px,6.4vw,28px)}.river-armies{--flag-size:min(156px,calc((100cqw - 30px)/2.65));min-height:180px;grid-template-columns:minmax(0,1fr) 30px minmax(0,1.65fr)}.river-divider{font-size:17px;transform:translateY(22px)}.river-side img{max-height:none}.scene-hero .lb::before,.scene-hero .lb::after{height:10px}@keyframes film-bars{from{height:50%}to{height:10px}}.experiment-opening>.cinema-bg{inset:-32px -16px -16px;width:calc(100% + 32px);height:calc(100% + 48px)}}
@media (prefers-reduced-motion:reduce){
  .scene-hero h1,.scene-hero .hero-meta,.experiment-opening h1,.scene-hero .lb::before,.scene-hero .lb::after,.named,.big-change,.simple-result,#s6pred>.prediction-review,#allRes,.main.simple>.simple-todo,.main.simple>.stepsec{animation:none}
  }

/* ===== opening: five scenes, lines arrive one by one ===== */
.intro{background:radial-gradient(ellipse at 82% 95%,rgba(133,43,30,.32),transparent 66%),radial-gradient(ellipse at 5% 15%,rgba(99,34,30,.18),transparent 62%),#07090b}
.intro .intro-in{max-width:52em;min-height:min(70vh,560px);align-content:center;gap:18px}
.iscene{display:grid;gap:14px;justify-items:center;text-align:center}
.iscene[hidden]{display:none}
.iscene .l{animation:fadeup 1s var(--ease-film) both;margin:0}
.iscene .l:nth-child(1){animation-delay:.2s}.iscene .l:nth-child(2){animation-delay:.9s}.iscene .l:nth-child(3){animation-delay:1.6s}.iscene .l:nth-child(4){animation-delay:2.3s}.iscene .l:nth-child(5){animation-delay:3s}
.iscene .it{animation:title 1.8s .5s var(--ease-film) both;margin:4px 0 8px}
.iscene .k{font-family:var(--f-display);letter-spacing:.2em;font-size:13px;color:#e8763c}
.iscene .big{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.6vw,36px);color:#f2e9da;line-height:1.4;word-break:keep-all}
.iscene .q{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.2vw,46px);line-height:1.35;color:#f2e9da;word-break:keep-all;text-shadow:0 0 40px rgba(232,118,60,.35)}
.iscene .q em{font-style:normal;color:#ff9a5c}.iscene .nw{white-space:nowrap}.iscene>.q,.iscene>.big{justify-self:stretch;display:block}
.iscene b{color:#f2e9da}.iscene .l{word-break:keep-all}
.ibars{display:grid;gap:10px;width:min(460px,100%);margin:6px 0}
.ibars div{display:grid;grid-template-columns:92px 1fr 34px;white-space:nowrap;gap:12px;align-items:center;text-align:left;font-size:14px;color:#cfc8ba}
.ibars i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#b8323f,#e8763c);width:calc(var(--v) * 1%);transform-origin:left;animation:ibar 1.4s 1.4s var(--ease-film) both}
.ibars b{font-size:15px;color:#f2e9da;text-align:right}
@keyframes ibar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.isteps{list-style:none;padding:0;display:grid;gap:4px;width:min(620px,100%);text-align:left}
.isteps li{display:grid;grid-template-columns:40px auto 1fr;column-gap:12px;align-items:baseline;padding:8px 14px;border-radius:8px;background:rgba(236,230,217,.04);counter-increment:st;animation:fadeup .8s var(--ease-film) both}.isteps li span{text-align:right}
.isteps li::before{content:"第" counter(st);font-family:var(--f-display);font-size:11px;letter-spacing:.15em;color:#e8763c}
.isteps li:nth-child(1){animation-delay:.6s}.isteps li:nth-child(2){animation-delay:.8s}.isteps li:nth-child(3){animation-delay:1s}.isteps li:nth-child(4){animation-delay:1.2s}.isteps li:nth-child(5){animation-delay:1.4s}.isteps li:nth-child(6){animation-delay:1.6s}
.isteps b{font-size:15.5px;color:#f2e9da;font-weight:600}.isteps span{font-size:12.5px;color:#a59f93}.isteps li:last-child{background:rgba(232,118,60,.12)}.isteps li:last-child b{color:#ffb489}
.isteps{counter-reset:st}
.idots{position:absolute;z-index:4;top:calc(11vh + 22px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;justify-content:center}
.idots i{width:22px;height:4px;border-radius:2px;background:rgba(236,230,217,.16)}
.idots i.on{background:#e8763c}
.intro .intro-controls{visibility:hidden;opacity:0;pointer-events:none;transition:opacity .3s ease}
.intro.ready .intro-controls{visibility:visible;opacity:1;pointer-events:auto}
.intro.revealed .iscene.on .l,.intro.revealed .iscene.on .it,.intro.revealed .iscene.on .isteps li{animation:none!important;opacity:1;transform:none;filter:none}
@media (max-width:760px){.isteps li{padding:8px 12px;grid-template-columns:34px 1fr}.isteps li span{display:none}.intro .intro-in{padding-top:30px}.isteps b{font-size:14.5px}.intro .intro-in{min-height:0}}
@media (prefers-reduced-motion:reduce){.iscene .l,.iscene .it,.ibars i,.isteps li,.intro .intro-controls{animation:none}}

/* ===== buttons: one shape everywhere, a slightly rounded square ===== */
:root{--r-btn:8px}
.btn,.intro .enter,.pick button,.presets .chip,.stepper a,.lab-link,.wi-card,.journey-outline,.opt{border-radius:var(--r-btn)}
.seg{border-radius:calc(var(--r-btn) + 2px)}.seg button{border-radius:calc(var(--r-btn) - 2px)}
.intro .enter{padding:12px 30px;min-width:132px;letter-spacing:.08em}

/* ===== breathing room: buttons sit apart from the text above and below ===== */
.intro .enter{margin-top:32px}
.prediction-form button{margin-top:28px}
.main .pane .btn:not(:first-child),.main .pane .pick:not(:first-child),.main .pane .ctrls:not(:first-child){margin-top:20px}
.main .pane .btn+div:not(:empty),.main .pane .pick+div:not(:empty),.main .pane .pick+.btn{margin-top:20px}
.pcard .pick{margin-top:14px}
.wi-panel .wi-step{margin-top:12px}
.lab-back{margin-top:28px}
@media (max-width:760px){.intro .enter{margin-top:32px}}
.keeper-welcome{display:block;margin-bottom:10px;color:var(--mark);font-size:.9em}

.intro-controls{display:grid;justify-items:center;gap:9px;margin-top:18px}.intro-controls .enter{margin:0}.intro-prev{background:none;border:0;padding:5px 18px;min-height:32px;color:#bcb4a5;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.intro-prev:disabled{visibility:hidden}.intro-prev:focus-visible{outline:2px solid var(--wind);outline-offset:3px}
.intro-method{list-style:none;margin:18px auto;padding:0;display:grid;gap:14px;text-align:left;max-width:480px}.intro-method li{border-left:2px solid var(--mark);padding-left:15px;display:grid;gap:4px}.intro-method b{font-size:16px;color:#ece6d9}.intro-method span{font-size:13px;color:#bcb4a5}.intro .intro-bridge{font-size:14px;line-height:1.9}
.prediction-footer{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.home-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:18px;padding:16px 20px;border:1px solid var(--rule);border-radius:var(--r);background:rgba(255,255,255,.025);width:100%;box-sizing:border-box}.home-progress .journey-outline{padding:0;background:none;border:0}.home-progress .journey-outline>summary{padding:13px 0;gap:18px}.home-progress .journey-outline>summary>.home-progress-count{color:var(--ink);font-size:13px}.home-progress .journey-outline>summary>span:last-child{font-size:11px}.home-progress>button{margin:0;align-self:start;min-height:48px}.home-progress .journey-outline ol{padding:8px 0 0}.home-progress .journey-outline li a{gap:12px;font-size:12px}.home-progress .journey-outline li a>small{display:none}
@media(max-width:760px){.home-progress{grid-template-columns:minmax(0,1fr);gap:7px;padding:12px 16px}.home-progress>button{width:100%;justify-content:space-between}.intro-method{gap:11px;margin:14px auto}.intro-method b{font-size:14px}.intro-method span{font-size:12px}.intro .intro-bridge{font-size:12px;line-height:1.9}.intro-controls{margin-top:13px;gap:6px}}

/* Stack all scenes in one grid cell. Hidden scenes reserve their natural height,
   so the tallest scene fixes the navigation row for every step and viewport. */
.intro .intro-in{width:min(52em,100%);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
.intro .intro-in>.iscene{grid-area:1 / 1;align-self:center;width:100%;min-width:0}
.intro .intro-in>.iscene[hidden]{display:grid;visibility:hidden;pointer-events:none}
.intro .iscene[hidden] .l,.intro .iscene[hidden] .it{animation:none}
.intro .intro-in>.intro-controls{grid-area:2 / 1;align-self:start;width:100%}
@media(max-height:700px){.intro{align-items:start;overflow-y:auto}.intro .intro-in{margin-block:20px}}
/* Keep stage navigation separate from the activity above and from the fixed tabs. */
.main>.pager{gap:24px;margin-block:28px 24px;padding-block:12px;align-items:center}
.pager>a.btn{min-height:48px;white-space:nowrap;padding:12px 20px;flex:0 0 auto}
.pager .ico{flex-shrink:0}
/* The stage list is a continuous underline tab strip. */
.stepper{gap:0;border-bottom:1px solid var(--rule);padding:0;margin:0}
.stepper a,.stepper a[aria-current="page"]{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;white-space:nowrap}
.stepper a[aria-current="page"]{border-bottom-color:var(--flame);color:var(--ink)}
.stepper a .st,.stepper a.done .st{background:none;border-radius:0;color:var(--ink-3);width:auto;min-width:18px;height:24px}
.stepper a[aria-current="page"] .st{color:var(--flame)}
@media(max-width:560px){.pager>a.btn{padding:12px 16px;font-size:13px}.main>.pager{gap:16px;margin-block:24px}}

/* ===== fewer labels: headings, numbers and position carry the meaning ===== */
.scene-hero .hero-meta,.step-h .sno,.named-tag,.experiment-edition,.simple-todo>span{display:none}
.simple-todo{grid-template-columns:minmax(0,1fr)!important;gap:6px}
#navH small,#navE a:not(.done) small,#navS small,#board li.ph small,.prediction-review>.journey-eyebrow{display:none}
.simple-todo>p.why,.simple-todo>p.key,.simple-todo details{grid-column:1}
.lab-choice-nav>span:empty{display:none}.lab-choice-nav{justify-content:flex-end}
#prediction-status,#wiStatus{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ===== home footer: prediction → start → the six stages, laid out openly ===== */
.prediction-footer{display:flex!important;justify-content:flex-end;padding-top:22px}
.prediction-footer .home-start{min-height:52px;padding:12px 28px;font-size:16px}
.home-steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 24px;margin-top:36px;padding-top:0}
.home-steps a{display:grid;gap:6px;align-content:start;text-decoration:none;color:var(--ink-3);padding:10px 0;transition:color .2s}
.home-steps a .num{font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.home-steps a .num .ico{width:14px;height:14px;color:var(--good)}
.home-steps a b{font-weight:500;font-size:13px;line-height:1.45;word-break:keep-all}
.home-steps a:hover{color:var(--ink)}
.home-steps a.done{color:var(--ink-2)}
.home-steps a.now{color:var(--ink)}.home-steps a.now .num{color:var(--flame)}
.experiment-replay{grid-column:1/-1;justify-self:start;margin-top:18px;font-size:12px;color:var(--ink-3)}
@media (max-width:760px){.prediction-footer .home-start{width:100%;justify-content:center}.home-steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px;margin-top:30px}}
</style>
