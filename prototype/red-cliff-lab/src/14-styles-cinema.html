<style>
/* ===== cinema: one look for every page (pairs with 85-cinema.js) ===== */
:root{--ease-film:cubic-bezier(.2,.7,.2,1);--heat:.2}

/* same grade on every stage: night river, ember glow rising with --heat */
.scene-hero,.scene-hero[data-fx]{background:
  radial-gradient(90% 85% at 72% 118%,rgba(120,46,18,calc(.25 + .55*var(--heat))) 0,transparent 62%),
  radial-gradient(80% 70% at 15% -10%,rgba(40,62,78,calc(.75 - .45*var(--heat))) 0,transparent 60%),
  linear-gradient(180deg,#121a21,#090c10)}
.scene-hero h1{word-break:keep-all;text-wrap:balance;animation:film-title 1.2s .25s var(--ease-film) both}
@keyframes film-title{from{opacity:.001;letter-spacing:.12em;filter:blur(6px)}to{opacity:1;letter-spacing:-.01em;filter:blur(0)}}
.scene-hero .hero-meta{animation:fadeup .9s .1s var(--ease-film) both}

/* letterbox bars close in like the opening, then settle */
.scene-hero .lb{box-shadow:none;opacity:1}
.scene-hero .lb::before,.scene-hero .lb::after{content:"";position:absolute;left:0;right:0;height:22px;background:#000;animation:film-bars 1.1s var(--ease-film) both}
.scene-hero .lb::before{top:0}.scene-hero .lb::after{bottom:0}
@keyframes film-bars{from{height:50%}to{height:22px}}

/* scene counter: six frames of film, the current one burning */
.reel{display:flex;gap:5px;margin-bottom:4px}
.reel i{width:22px;height:4px;border-radius:2px;background:rgba(236,230,217,.14)}
.reel i.past{background:rgba(232,118,60,.55)}
.reel i.now{background:var(--flame);box-shadow:0 0 10px rgba(255,122,61,.8)}

/* home: the same river scene behind the question */
.experiment-opening{position:relative;isolation:isolate}
.experiment-opening>.cinema-bg{position:absolute;inset:-48px -40px -24px;width:calc(100% + 80px);height:calc(100% + 72px);z-index:-1;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 45%,transparent 100%)}
.experiment-opening h1{word-break:keep-all;animation:film-title 1.2s .2s var(--ease-film) both}

/* cut between pages: a short fade from black */
#cinema-cut{position:fixed;inset:0;z-index:90;background:#000;pointer-events:none;opacity:0}
#cinema-cut.on{animation:film-cut .55s ease-out both}
@keyframes film-cut{from{opacity:.85}to{opacity:0}}

/* result moments: the box settles in (no decorative lines) */
.named,.big-change,.simple-result,#s6pred>.prediction-review,#allRes{animation:fadeup .7s var(--ease-film) both}

/* home figure: same night-river grade as the stage scenes, no stripe pattern */
.experiment-river{background:
  radial-gradient(90% 85% at 72% 118%,rgba(120,46,18,calc(.25 + .55*var(--heat))) 0,transparent 62%),
  radial-gradient(80% 70% at 15% -10%,rgba(40,62,78,calc(.75 - .45*var(--heat))) 0,transparent 60%),
  linear-gradient(180deg,#121a21,#090c10);border:1px solid rgba(236,228,212,.1);box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.experiment-river .river-lines{display:none}
.river-caption{color:#a59f93}.river-divider{color:#e8763c;opacity:.7}

/* remove separator lines that carried no meaning; group with surfaces instead */
.experiment-opening{border-bottom:0}
.journey-outline{border:0;background:rgba(255,255,255,.025);border-radius:var(--r);padding:0 16px}
.journey-outline li a{border-top:0}
.prediction-review{border-top:0;background:rgba(255,255,255,.025);border:1px solid rgba(236,228,212,.08);border-radius:var(--r);padding:22px}
.prediction-comparison{border:0;padding:4px 0}
.pcard-tip{border-top:0;padding-top:2px}

/* stage content arrives in the same order every time */
.main.simple>.simple-todo{animation:fadeup .7s .35s var(--ease-film) both}
.main.simple>.stepsec{animation:fadeup .7s .5s var(--ease-film) both}

@media (max-width:760px){.scene-hero .lb::before,.scene-hero .lb::after{height:14px}@keyframes film-bars{from{height:50%}to{height:14px}}.experiment-opening>.cinema-bg{inset:-32px -16px -16px;width:calc(100% + 32px);height:calc(100% + 48px)}}
@media (prefers-reduced-motion:reduce){
  .scene-hero h1,.scene-hero .hero-meta,.experiment-opening h1,.scene-hero .lb::before,.scene-hero .lb::after,.named,.big-change,.simple-result,#s6pred>.prediction-review,#allRes,.main.simple>.simple-todo,.main.simple>.stepsec{animation:none}
  }
</style>
