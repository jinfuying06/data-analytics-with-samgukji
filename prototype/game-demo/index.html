<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계책록 — 제갈량이 조조 편이었다면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
/* 색은 맡은 일이 하나씩: 금색=지금 할 일, 위·오·촉 색=세력, 나머지는 무채색.
   --line은 기본 테두리(차분하게), --red는 위 세력과 같은 색이라 세력 표시 밖에서는 쓰지 않는다. */
:root{--bg:#0f1114;--grid:rgba(255,255,255,.018);--card:#171a1e;--line:#3f444b;--line-hi:#6a6f77;--ink:#f1ebde;--dim:#b9b1a1;--red:#d6463c;--gold:#e8b030;--wei:#d6463c;--wu:#4a90c2;--shu:#5c9a5a;--ally:#4a90c2;--px:"Galmuri11","Galmuri9",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 16px 80px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.px{font-family:var(--px)}
.box{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:20px 22px}
.box.gold{border-color:var(--gold)}.box.red{border-color:var(--line-hi)}
.tag{font-size:13px;font-weight:700;color:var(--gold)}
.logo{font-family:var(--px);font-weight:700;color:var(--gold);text-shadow:4px 4px 0 #000;line-height:1.15}
.dim{color:var(--dim)}
.num{font-family:var(--px);font-variant-numeric:tabular-nums}
.btn{font-family:var(--px);background:var(--gold);color:#1a1205;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 18px;font-size:15px;text-decoration:none;display:inline-block}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
[hidden]{display:none!important}
.stack{display:grid;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
img.spr{image-rendering:pixelated;display:block}

/* 대화창 */
.dlg{position:relative;padding:14px 20px 22px;min-height:88px;cursor:pointer}
.dlg .who{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px}
.dlg .say{font-size:16px;min-height:1.6em}
.dlg .more{position:absolute;right:14px;bottom:10px;width:12px;height:8px;background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.talk{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:end}
.face{aspect-ratio:1;display:grid;place-items:center;padding:0;overflow:hidden;background:#1b2530;font-family:var(--px);font-size:52px;color:var(--ink)}
.face img{width:160%;max-width:none}
.face img.pt{width:100%;max-width:100%;image-rendering:pixelated}
.pcard .pt{width:64px;height:64px;border:2px solid var(--line);image-rendering:pixelated}

/* 타이틀 */
.title{display:grid;align-items:center;min-height:82vh;max-width:820px;margin:0 auto}
.title .logo{font-size:clamp(56px,9vw,104px)}
.title h2{font-family:var(--px);font-size:22px;margin:16px 0 4px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.hud .logo{font-size:26px;text-shadow:3px 3px 0 #000;background:none;border:0;padding:0}
.stats{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;align-items:center}
.bar{display:inline-block;width:130px;height:12px;border:2px solid var(--line);vertical-align:middle;margin-left:6px;background:#000}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s steps(6)}
.tools{display:inline-flex;gap:4px}
.tl{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);font-family:"Noto Serif KR","Batang",serif;font-size:14px;opacity:.3}
.tl.on{opacity:1;border-color:var(--gold);color:var(--gold);background:#000}
.tool-get{display:flex;gap:12px;align-items:center;justify-content:center;margin:10px 0 0}
.tool-get .tl{width:44px;height:44px;font-size:24px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;padding:0;list-style:none}
.skills li{display:flex;gap:10px;align-items:center}
.skills .tl{width:36px;height:36px;font-size:20px;flex:none}

/* 프롤로그 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs .side{display:grid;justify-items:center;gap:6px;font-family:var(--px)}
.vs .side img{width:min(260px,100%)}
.vs .vsmark{font-family:var(--px);font-size:34px;color:var(--gold);text-shadow:3px 3px 0 #000}
.flip{transform:scaleX(-1)}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);padding:10px 14px;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--line-hi);background:#20242a}
.opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(232,176,48,.12)}
.opt:hover::before,.opt[aria-pressed="true"]::before{content:"▶ "}
.opt.ok{background:var(--gold);color:#111;border-color:var(--gold)}
.opt.no{border-style:dashed;border-color:var(--line-hi);color:var(--dim);background:transparent}
.move{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;font-family:var(--px)}
.move b{display:block;font-size:18px;margin-top:4px}

/* 지도 */
.map{position:relative;padding:26px 22px 22px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nodes{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:190px}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;color:var(--dim)}
.node .sq{position:relative;z-index:1;width:30px;height:30px;background:var(--line);border:3px solid #000;box-shadow:3px 3px 0 #000}
.node.now .sq{background:var(--gold);animation:bob 1s steps(2) infinite}
.node.clear .sq{background:var(--ink)}
.node.lock{cursor:not-allowed;opacity:.45}
.node.now,.node.clear{color:var(--ink)}
.node:focus-visible .sq{outline:3px dashed var(--gold);outline-offset:5px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* 퀘스트 공통 */
.qhead h1{font-family:var(--px);font-size:clamp(22px,3.2vw,34px);color:var(--ink);text-shadow:3px 3px 0 #000;margin:8px 0 10px;line-height:1.35}
.concept{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.concept b{color:var(--gold)}
.mission{font-size:13px;color:var(--dim)}
.step{display:grid;gap:12px}
.step>h2{font-family:var(--px);font-size:17px;display:flex;gap:10px;align-items:center}
.step>h2 .sno{background:var(--gold);color:#111;padding:2px 8px;font-size:12px}
.named{border-color:var(--gold)}
.named .tag{color:#111;background:var(--gold);padding:2px 8px;display:inline-block}
.named h3{font-family:var(--px);font-size:18px;margin:10px 0 6px;color:var(--gold)}
.named p{margin:0}
.big{font-family:var(--px);font-size:28px}
.note{color:var(--dim);font-size:14px;margin:8px 0 0}
.fb{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--gold);background:rgba(232,176,48,.08)}
.fb.bad{border-color:var(--line-hi);background:rgba(255,255,255,.04)}
.shake{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}

/* 1: 인물 카드 */
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pcard{display:grid;gap:8px;align-content:start;padding:16px}
.pcard h3{font-family:var(--px);font-size:18px;display:flex;gap:8px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border:2px solid currentColor}
.chip.wei{color:var(--wei)}.chip.wu{color:var(--wu)}.chip.shu{color:var(--shu)}
.pcard .fact{font-size:13px;color:var(--dim);margin:0}
.pcard .pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pcard .pick button{border:2px solid var(--line);background:transparent;padding:6px 4px;font-size:13px}
.pcard .pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#111}
.pcard .tip{font-size:13px;margin:0;color:var(--ink)}
.pcard.in{border-color:var(--gold)}.pcard.out{opacity:.7;border-style:dashed}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side-n{display:grid;gap:2px;padding:14px;border:3px solid var(--line)}
.side-n.b{border-color:var(--side-b)}.side-n.a{border-color:var(--side-a)}
.side-n b{font-family:var(--px);font-size:34px}
.seg{display:inline-flex;border:2px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#111}

/* 막대 */
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:5.5em 1fr 3.5em;gap:10px;align-items:center;font-size:14px}
.brow .track{position:relative;height:18px;background:#000;border:2px solid #333}
.brow .fill{display:block;height:100%;transition:width .5s steps(8)}
.brow.out{opacity:.3}
.brow .avgm{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--gold);transition:left .5s steps(8)}
.brow b{font-family:var(--px);text-align:right}

/* 줄다리기 */
.tug{display:grid;gap:8px}
.tug .nums{display:flex;justify-content:space-between;font-family:var(--px);font-size:14px}
.tug .nums b{font-size:22px}
.tug .rope{display:flex;height:26px;border:3px solid var(--line);background:#000;position:relative}
.tug .rope i{display:block;height:100%;transition:width .5s steps(10)}
.tug .rope .w{background:var(--side-b-fill)}.tug .rope .a{background:var(--side-a-fill)}
.tug .rope::after{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:3px;background:var(--gold)}
.stepper{display:grid;gap:10px}
.stepper .w{display:grid;grid-template-columns:5em auto;gap:10px;align-items:center;font-family:var(--px)}
.stepper .ctl{display:inline-flex;align-items:center;border:2px solid var(--line)}
.stepper .ctl button{border:0;background:transparent;width:34px;height:32px;font-family:var(--px);font-size:16px}
.stepper .ctl button:hover{background:#20242a}
.stepper .ctl output{min-width:3.4em;text-align:center}
.pips{display:inline-flex;gap:3px;margin-left:8px}.pips i{width:10px;height:10px;background:#333}.pips i.on{background:var(--gold)}
.kcount{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kcount div{border:2px solid var(--line);padding:12px;display:grid}
.kcount b{font-family:var(--px);font-size:30px;color:var(--gold)}
.kcount span{font-size:13px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}

/* 4: 와플 */
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.waffle{display:grid;grid-template-columns:repeat(36,1fr);gap:3px;margin-top:12px}
.waffle i{aspect-ratio:1;background:#222;animation:pop .01s steps(1) backwards;animation-delay:calc(var(--k)*8ms)}
.waffle i.a{background:var(--side-a)}.waffle i.w{background:var(--side-b)}
@keyframes pop{from{opacity:0}}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin-top:8px}
.key i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}

/* 5: 원문 */
blockquote.ev{margin:12px 0 0;padding:14px 16px;border:2px dashed var(--line);background:#0a0b0d;font-size:15px;line-height:1.8}
.kw{color:#111;background:var(--gold);padding:0 2px}

/* 6: 전장 */
.arena{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:end;gap:8px;text-align:center}
.arena img{width:100%;max-width:240px;margin:0 auto}
.arena .lbl{font-size:13px;font-weight:700}
.gauge{display:grid;gap:8px}
.gauge .head{display:flex;justify-content:space-between;align-items:baseline}
.gauge .v{font-family:var(--px);font-size:40px;color:var(--gold)}
.gauge .verd{font-family:var(--px)}
.gauge .trk{position:relative;height:26px;border:3px solid var(--line);background:linear-gradient(90deg,rgba(79,127,214,.35),transparent 45%,transparent 55%,rgba(217,80,63,.35))}
.gauge .pin{position:absolute;top:-10px;width:8px;height:40px;background:var(--gold);border:2px solid #000;transform:translateX(-50%);transition:left .7s steps(14)}
.gauge .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);opacity:.5}
.gauge .ghost{position:absolute;top:2px;width:6px;height:16px;background:var(--dim);transform:translateX(-50%)}
.gauge .sc{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

/* 한자 이름 패와 깃발 (인물 그림 대신) */
.hz{display:inline-grid;place-items:center;font-family:"Noto Serif KR","Batang",serif;font-weight:700;font-size:18px;padding:4px 8px;border:3px solid var(--line);background:#0a0b0d;color:var(--ink);box-shadow:3px 3px 0 #000;letter-spacing:.06em;line-height:1.1}
.hz.wei{border-color:var(--wei)}.hz.wu{border-color:var(--wu)}.hz.shu{border-color:var(--shu)}
.hz.big{width:100%;height:100%;border:0;box-shadow:none;background:transparent;font-size:clamp(26px,3.4vw,40px);writing-mode:vertical-rl;padding:0}
.face:has(.hz.wei){background:#2a1214}.face:has(.hz.wu){background:#10202e}.face:has(.hz.shu){background:#132219}
.pcard .hz{justify-self:start}
.flags{display:flex;justify-content:center;gap:4px;transition:opacity .3s}
.flag{width:100%;max-width:200px;image-rendering:pixelated;display:block}
.flags .flag+.flag{margin-left:-8%}
.flags.win{animation:rally .4s steps(2) 3}
.flags.lose{opacity:.45;filter:grayscale(.6)}
@keyframes rally{50%{transform:translateY(-8px) scale(1.04)}}
.vs .side .flag{max-width:180px}
.arena .flags .flag{max-width:130px}
.zg-token{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}
.zg-token .hz{border-color:var(--side-a);transition:transform .6s steps(6)}
.zg-token.to-b .hz{border-color:var(--side-b);animation:hop .6s steps(3)}.zg-token.to-out .hz{border-color:var(--line);opacity:.5;animation:hop .6s steps(3)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:10px}
.pair{display:grid;grid-template-columns:128px 1fr 100px;gap:4px 10px;align-items:center;width:100%;text-align:left;background:transparent;border:2px solid var(--line);padding:8px 10px;color:var(--ink);margin:0 0 6px;font:inherit;cursor:pointer}
.pair:hover{background:#20242a}.pair .bars2{display:grid;gap:4px}.pair .t{height:10px;background:#2a2e34;position:relative}.pair .t i{display:block;height:100%}
.pair .d{font-size:13px;color:var(--dim);text-align:right}.pair.ok{border-color:var(--gold)}.pair.no{border-style:dashed}
.key2{display:flex;gap:14px;font-size:13px;color:var(--dim);margin:6px 0}.key2 i{display:inline-block;width:12px;height:8px;margin-right:4px}
.card-ev{margin-top:12px}.card-ev .src{font-size:13px;color:var(--dim)}
/* 대사 상자 안의 선택지 (타이틀) */
.choices{display:grid;gap:6px;margin-top:12px}
.choice{display:block;width:100%;text-align:left;background:transparent;border:2px solid transparent;color:var(--ink);padding:8px 10px 8px 30px;position:relative}
.choice b{font-family:var(--px);font-size:16px}.choice span{display:block;font-size:13px;color:var(--dim)}
.choice:hover,.choice:focus{border-color:var(--gold);outline:none}
.choice:hover::before,.choice:focus::before{content:"▶";position:absolute;left:9px;top:9px;color:var(--gold);animation:blink 1s steps(2) infinite}
/* 연표: 전투를 일어난 해 순서로 */
.chron{list-style:none;margin:16px 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px;position:relative}
.chron::before{content:"";position:absolute;left:6%;right:6%;top:58px;border-top:3px dashed var(--line)}
.cnode{position:relative;width:100%;display:grid;justify-items:center;gap:2px;background:var(--card);border:2px solid var(--line);padding:10px 6px}
.cnode .yr{font-family:var(--px);font-size:13px;color:var(--dim)}.cnode .hz{font-family:var(--px);font-size:28px;line-height:1.3;color:var(--ink)}
.cnode .nm{font-size:13px}.cnode .st{font-size:12px;color:var(--gold);min-height:1.5em}
.cnode.sealed{border-style:dashed}.cnode.sealed .hz,.cnode.sealed .nm{color:#5b6068}.cnode.sealed .st{color:var(--dim)}
.cnode[aria-pressed="true"]{border-color:var(--gold);box-shadow:4px 4px 0 #000;transform:translateY(-4px)}
.cnode:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
.dlg.chat{cursor:default}.dlg.chat .row{margin-top:12px}
@media (hover:none){.keyhint{display:none}}
/* 사다리 예고·열림 */
.pcard.lit{border-color:var(--gold)}
.pcard.sealed{border-style:dashed;opacity:.75}.pcard.sealed .tag{color:var(--dim)}
.seal{font-family:var(--px);font-size:26px;color:var(--dim);letter-spacing:4px}
.pcard.unseal{border-color:var(--gold);animation:unseal .7s steps(6) both}.pcard.unseal+.pcard.unseal{animation-delay:.5s}
@keyframes unseal{from{opacity:0;transform:scale(.7)}}
@keyframes hop{50%{transform:translateY(-12px)}}
.clear-pt{width:160px!important;border:3px solid var(--line);margin:4px auto}

/* 확인 문제 */
.quiz h2{font-family:var(--px);font-size:16px;margin:6px 0 12px}

/* 결과 창 */
.pop{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:rgba(0,0,0,.6);padding:16px}
.pop .box{text-align:center;padding:28px 32px;max-width:520px}
.pop .logo{font-size:52px}
.pop img{width:220px;margin:0 auto}
.report{display:grid;gap:16px}
.report ol{margin:0;padding-left:1.4em;display:grid;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{border:3px solid var(--line);padding:14px}
.cmp b{font-family:var(--px);display:block;font-size:17px;margin-top:4px}

@media (max-width:760px){
 .title{min-height:auto;padding-top:12px}
 .chron{grid-template-columns:1fr}.chron::before{display:none}
 .cnode{grid-template-columns:40px 92px 1fr;justify-items:start;align-items:center;text-align:left;padding:6px 10px}.cnode .hz{font-size:22px;white-space:nowrap}.cnode .st{grid-column:3}.cnode[aria-pressed="true"]{transform:translateX(6px)}
 .pcards{grid-template-columns:1fr 1fr}
 .friends,.cols,.cmp,.kcount{grid-template-columns:1fr}
 .nodes{grid-template-columns:repeat(3,1fr);height:auto;row-gap:24px}
 .map svg{display:none}
 .node{padding-top:0!important}
 .kcount{grid-template-columns:repeat(3,1fr)}
 .talk{grid-template-columns:80px 1fr}.face{font-size:32px}
 .bar{width:80px}
 .waffle{grid-template-columns:repeat(18,1fr)}
 .arena{grid-template-columns:1fr 1fr}.arena .gauge{grid-column:1/-1;order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.waffle i{opacity:1}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="app"></main>

<!-- 전투 데이터와 내용: ?b=<전투 id>, 기본은 적벽. 적벽 데이터는 기존 화면(red-cliff-lab)과 같은 파일. 형식: docs/BATTLE_CONTENT_FORMAT.md -->
<script src="core.js"></script>
<script>
/* 연표: 일어난 해 순서. id가 없는 전투는 아직 만들지 않은 '봉인된 기록'. key는 그 전투 내용 파일의 saveKey와 같아야 한다 */
const BATTLE_LIST=[
 {name:"관도대전",hz:"官渡",year:200,mission:"만약 허유가 원소 곁에 남았다면?"},
 {id:"red-cliff",name:"적벽대전",hz:"赤壁",year:208,key:"gyechaek-zg",mission:"만약 제갈량이 조조의 편이었다면?",first:1},
 {name:"번성·맥성",hz:"樊城",year:219,mission:"만약 맹달이 관우를 구하러 갔다면?"},
 {id:"yiling",name:"이릉대전",hz:"夷陵",year:222,key:"gyechaek-yiling",mission:"만약 육손이 오의 대도독이 아니었다면?"},
 {name:"오장원",hz:"五丈原",year:234,mission:"만약 제갈량이 오래 살았다면?"}];
const BATTLE_ID=(q=>BATTLE_LIST.some(b=>b.id&&b.id===q)?q:"red-cliff")(new URLSearchParams(location.search).get("b"));
const DATA_SRC={"red-cliff":"../red-cliff-lab/src/30-data.js"};
document.write(`<script src="${DATA_SRC[BATTLE_ID]||`battles/${BATTLE_ID}-data.js`}"><\/script><script src="battles/${BATTLE_ID}.js"><\/script>`);
</script>
<script>
/* ===== 데이터와 계산: 계산은 core.js, 전투 설정은 BATTLE, 화면 문구는 CONTENT ===== */
const K=CONTENT,SA=BATTLE.sides.a,SB=BATTLE.sides.b;
document.title=`계책록 — ${K.mission.replace(/^만약 |\?$/g,"")}`;
const C=Core.battle(BATTLE),PP=C.people(DB);
const NAMES=DB.map(r=>r[0]);
const FN={wei:"위",wu:"오",shu:"촉"};
const {avg,median}=Core;
const IND=BATTLE.indicators,SKEYS=BATTLE.score,at=k=>Object.keys(IND).indexOf(k),indKo=k=>IND[k].ko;
const TOTAL=6**SKEYS.length-1;
const f1=x=>Number.isInteger(x)?String(x):x.toFixed(1);
const fresh=()=>({rule:{min:2,dead:1},w:Object.fromEntries(SKEYS.map((k,i)=>[k,[3,3,2][i]])),done:{},t:{},req:{},design:{},pred:null,stage:0});
/* 퀘스트를 마치면 얻는 도구. 도구 하나가 분석 기술 하나다. pro는 보고서에서만 보여 주는 실무 용어 */
const TOOLS=[
 {ch:"筆",name:"붓",does:"셀 대상 정하기",pro:"분석 대상 정의 · 필터"},
 {ch:"算",name:"주판",does:"모아 세고 대표값 구하기",pro:"집계 · 평균과 중앙값"},
 {ch:"衡",name:"저울",does:"기록에 무게 달기",pro:"지표 설계 · 가중치"},
 {ch:"篩",name:"체",does:"규칙을 바꿔 걸러 보기",pro:"민감도 분석"},
 {ch:"鏡",name:"돋보기",does:"숫자 뒤의 원문 보기",pro:"근거 확인 · 타당도"},
 {ch:"扇",name:"부채",does:"조건 하나 바꿔 보기",pro:"What-if 시뮬레이션 · 가정"}];
const toolTile=(i,on)=>`<span class="tl${on?" on":""}" aria-hidden="true">${TOOLS[i].ch}</span>`;
let S=fresh();try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(K.saveKey)||"{}"))}catch{}
const save=()=>{try{localStorage.setItem(K.saveKey,JSON.stringify(S))}catch{}};
const roster=()=>C.roster(PP,S.rule);
const scoreOf=(n,w=S.w)=>C.score(PP,n,w);
const fs=(w=S.w,r=roster(),mut)=>C.factionScores(PP,w,r,mut);
/* 두 편: a는 지수가 재는 쪽, b는 상대. 화면에서는 b를 왼쪽, a를 오른쪽에 둔다 */
const sideOf=f=>SA.factions.includes(f)?"a":SB.factions.includes(f)?"b":null;
const sideSum=(s=fs())=>({a:SA.factions.reduce((x,f)=>x+(s[f]||0),0),b:SB.factions.reduce((x,f)=>x+(s[f]||0),0)});
const sideCount=(r=roster())=>({a:r.filter(n=>sideOf(PP[n].f)==="a").length,b:r.filter(n=>sideOf(PP[n].f)==="b").length,all:r.length});
const facMembers=f=>roster().filter(n=>PP[n].f===f);
const MOVED={[K.q6.mover]:K.q6.to};
const idx=(mut,wmode)=>C.allyIndex(PP,S.w,roster(),mut,wmode);
const verdict=C.verdict;
const fill=(t,o)=>t.replace(/\{(\w+)\}/g,(m,k)=>k in o?o[k]:m);
{const col=s=>s.factions.length>1?"var(--ally)":`var(--${s.factions[0]})`,
  stripe=s=>s.factions.length>1?`repeating-linear-gradient(90deg,${s.factions.map((f,i)=>`var(--${f}) ${i*12}px ${(i+1)*12}px`).join(",")})`:col(s),r=document.documentElement.style;
 r.setProperty("--side-a",col(SA));r.setProperty("--side-b",col(SB));r.setProperty("--side-a-fill",stripe(SA));r.setProperty("--side-b-fill",stripe(SB))}
const sideColor=f=>({a:"var(--side-a)",b:"var(--side-b)"}[sideOf(f)]||"var(--dim)");
const sideShort=f=>({a:SA.short,b:SB.short}[sideOf(f)]||"명단 밖");

/* ===== 화면 도우미 ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-44032;return c>=0&&c<11172&&c%28?a:b};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* 이미지는 기록관 그림과 세력 깃발만 씁니다. 그 밖의 인물은 한자 이름 패로 표시합니다. */
const FLAG_DIR="../../frontend/public/sprites/factions/";
const FLAG_KO={wei:"위",wu:"오",shu:"촉"};
const flag=(f,cls="")=>`<img class="flag ${cls}" src="${FLAG_DIR}${f}-flag.${RM?"png":"gif"}" alt="${FLAG_KO[f]} 깃발">`;
const flags=s=>s.factions.map(f=>flag(f)).join("");
const ARCHIVIST="assets/portraits/archivist.png";
const BY_KO={};DB.forEach(r=>BY_KO[r[1]]=r[0]);
/* 한자 이름 패: 세력색 테두리 */
const nameTile=(ko,cls="")=>{const h=BY_KO[ko],f=h&&PP[h].f;return `<span class="hz ${f||""} ${cls}" lang="zh-Hant">${esc(h||ko)}</span>`};
const PREDICTIONS=K.predictions;
const REPORT_LIMIT="이 숫자는 기록에 이름과 낱말이 나온 횟수로 만든 지표입니다. 이 결과만으로 실제 전투의 승패를 단정할 수는 없습니다.";
const hiKw=(t,ko)=>esc(t).replace(ko==="불"?/불(?![러렀구과평만안편어었])/g:new RegExp(ko,"g"),m=>`<b class="kw">${m}</b>`);

let typing=null;
function type(el,text){clearInterval(typing);el.dataset.full=text;if(RM){el.textContent=text;return}let i=0;el.textContent="";typing=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typing)},26)}
function skipType(){const el=$(".dlg .say");if(el&&el.dataset.full&&el.textContent!==el.dataset.full){clearInterval(typing);el.textContent=el.dataset.full;return true}return false}
/* 두 편 깃발: 앞서는 쪽은 들썩이고, 밀리는 쪽은 흐려집니다 */
const duel=(bSel,aSel,winner)=>{const w=$(bSel),a=$(aSel);if(!w||!a)return;
 [[w,"b"],[a,"a"]].forEach(([el,k])=>{el.classList.remove("win","lose");void el.offsetWidth;if(winner!=="tie")el.classList.add(winner===k?"win":"lose")})};
const portrait=who=>who==="기록관"?`<img class="pt" src="${ARCHIVIST}" alt="">`:nameTile(who,"big");
const talk=(who,side,hz,text)=>`<div class="talk"><div class="box face" aria-hidden="true">${portrait(who)}</div><div class="box dlg" role="status"><div class="who">${esc(who)} · ${esc(side)}</div><div class="say" data-text="${esc(text)}"></div><span class="more"></span></div></div>`;
const startTalk=()=>{const el=$(".dlg .say[data-text]");if(el)type(el,el.dataset.text)};
const stepH=(n,t)=>`<h2><span class="sno">활동 ${n}</span>${t}</h2>`;
const named=(term,text)=>`<section class="box named"><span class="tag">방금 한 것</span><h3>${term}</h3><p>${text}</p></section>`;
const seg=(id,opts,v)=>`<span class="seg" id="${id}">${opts.map(([k,l])=>`<button data-v="${k}" aria-pressed="${String(k)===String(v)}">${l}</button>`).join("")}</span>`;
const onSeg=(id,fn)=>$("#"+id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$$(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));fn(b.dataset.v)});
function barsHTML(items,max,unit=""){return `<div class="bars">${items.map(it=>`<div class="brow"><span>${esc(it.label)}</span><span class="track"><span class="fill" style="width:${max?it.v/max*100:0}%;background:${it.c}"></span></span><b>${f1(it.v)}${unit}</b></div>`).join("")}</div>`}
function tugHTML(w,a,unit="점"){const t=(w+a)||1,p=w/t*100;return `<div class="tug" role="img" aria-label="${SB.name} ${w}${unit}, ${SA.name} ${a}${unit}"><div class="nums"><span>${SB.short} <b>${w.toLocaleString()}</b>${unit}</span><span>${SA.short} <b>${a.toLocaleString()}</b>${unit}</span></div><div class="rope"><i class="w" style="width:${p}%"></i><i class="a" style="width:${100-p}%"></i></div><div class="nums dim"><span>${Math.round(p)}%</span><span>${100-Math.round(p)}%</span></div></div>`}
function gaugeHTML(i,ghost){return `<div class="gauge"><div class="head"><span class="v">${i}</span><span class="verd">${verdict(i)}</span></div><div class="trk" aria-hidden="true"><i class="mid"></i>${ghost!=null?`<i class="ghost" style="left:${ghost}%"></i>`:""}<i class="pin" style="left:${i}%"></i></div><div class="sc"><span>${SB.short} 앞섬</span><span>비슷함</span><span>${SA.short} 앞섬</span></div></div>`}

/* ===== 6단계: 문구는 CONTENT.stages, 완료 창에 남는 기록(ev)만 여기서 계산 ===== */
const MISSION=K.mission;
const avgOf=(f,drop)=>{let v=facMembers(f).map(n=>PP[n].pa).sort((a,b)=>b-a);if(drop)v=v.slice(1);return avg(v)};
const focusTop=f=>facMembers(f).sort((a,b)=>PP[b].pa-PP[a].pa)[0];
const EV=[
 ()=>{const c=sideCount();return `내 기준: ${S.rule.min}회 이상 · 죽은 사람 ${S.rule.dead?"뺌":"셈"} → ${SB.short} ${c.b}명, ${SA.short} ${c.a}명`},
 ()=>{const f=K.q2.faction,t=focusTop(f);return `${FN[f]} 평균 ${f1(avgOf(f))} → ${PP[t].ko} 빼면 ${f1(avgOf(f,1))} · 중앙값 ${FN[f]} ${f1(median(facMembers(f).map(n=>PP[n].pa)))}`},
 ()=>{const s=sideSum();return `점수(${SKEYS.map(k=>`${indKo(k)} ${S.w[k]}`).join("·")}): ${SA.short} ${s.a} vs ${SB.short} ${s.b}`},
 ()=>`${TOTAL}가지 점수 규칙 중 ${S.t.win}가지에서 ${SA.short} 점수가 더 높음`,
 ()=>fill(K.q5.ev,{n:PP[K.q5.person].ko,ind:indKo(K.q5.indicator),v:PP[K.q5.person].yy[at(K.q5.indicator)]}),
 ()=>fill(K.q6.ev,{base:idx(null,"env"),e:idx(MOVED,"env"),z:idx(MOVED,"zg")})];
const STAGES=K.stages.map((s,i)=>({...s,check:{...s.check,ev:EV[i]}}));

/* ===== 공통 틀 ===== */
let onAdvance=null,onBack=null,fxLevel=1;
const doneCount=()=>Object.keys(S.done).length;
const nextStage=()=>{const i=STAGES.findIndex((_,k)=>!S.done[k+1]);return i<0?6:i};
function hud(){const n=doneCount();return `<header class="hud"><button class="logo" id="toMap" aria-label="원정 지도로">계책록</button>
 <div class="stats"><span>진행 ${n}/6<span class="bar"><i style="width:${n/6*100}%"></i></span></span><span class="tools" role="img" aria-label="얻은 도구: ${TOOLS.filter((_,k)=>S.done[k+1]).map(t=>t.name).join(", ")||"없음"}">${TOOLS.map((_,k)=>toolTile(k,S.done[k+1])).join("")}</span></div></header>`}
const wireHud=()=>{$("#toMap").onclick=()=>map()};

/* ===== 타이틀 ===== */
/* 다른 전투의 진행은 그 전투의 저장 칸에서 읽는다 */
const progressOf=b=>{if(!b?.id)return null;if(b.id===BATTLE_ID)return S;try{return JSON.parse(localStorage.getItem(b.key)||"null")}catch{return null}};
const doneOf=s=>Object.keys(s?.done||{}).length;
const started=b=>{const s=progressOf(b);return !!s&&(s.pred!=null||doneOf(s)>0)};
function statusOf(b){
 if(!b.id)return "봉인된 기록";
 const s=progressOf(b),n=doneOf(s);
 if(n<6)return n||s?.pred!=null?`★ 진행 ${n}/6`:b.first?"첫 기록":"아직 펼치지 않음";
 return "★".repeat(1+Object.values(s.req||{}).some(r=>r.done)+!!s.design?.done)+" 얻음";
}
function enter(b){
 try{localStorage.setItem("gyechaek-last",b.id)}catch{}
 if(b.id===BATTLE_ID)S.pred==null?prologue():map();else location.href=`?b=${b.id}&go=1`;
}
function choiceHTML(list){return `<div class="choices" data-nav>${list.map(([t,s],i)=>`<button class="choice" data-i="${i}"><b>${esc(t)}</b><span>${esc(s)}</span></button>`).join("")}</div>`}
function wireChoices(list){$$(".choice").forEach(b=>b.onclick=e=>{e.stopPropagation();list[+b.dataset.i][2]()});$(".choice")?.focus()}

/* 미연시처럼 대사 상자 왼쪽에 작은 초상화 (.talk 틀은 퀘스트 대사와 같다) */
const archFace=`<div class="box face"><img class="pt" src="assets/portraits/archivist.png" alt="돋보기를 든 기록관"></div>`;
/* ===== 타이틀: 기록관 대사 상자 안에서 고른다. 선택지는 늘 두 개, 전투 목록은 연표에서 ===== */
function title(){
 fxLevel=1;onBack=null;
 let last=null;try{last=BATTLE_LIST.find(b=>b.id&&b.id===localStorage.getItem("gyechaek-last"))}catch{}
 if(!started(last))last=BATTLE_LIST.find(started)||null;
 const first=BATTLE_LIST.find(b=>b.first);
 const list=[last?[`이어서 하기 — ${last.hz} ${last.name}`,`${statusOf(last)} · ${last.mission}`,()=>enter(last)]
   :[`${first.hz} ${first.name}부터 펼치기`,`첫 기록 · ${first.mission}`,()=>enter(first)],
  ["다른 기록 고르기","연표에서 전투를 골라 그 '만약'을 펼칩니다",()=>chronicle()]];
 app.innerHTML=`<section class="title">
  <div><div class="tag">『삼국지연의』 데이터 실험</div>
   <h1 class="logo">계책록</h1>
   <h2>삼국지로 배우는 데이터 분석</h2>
   <div class="talk" style="margin-top:22px;align-items:start">${archFace}<div class="box dlg chat"><div class="who">기록관</div><div class="say"></div>${choiceHTML(list)}</div></div>
   <p class="dim keyhint" style="font-size:13px">↑↓ 고르기 · Enter 펼치기</p></div></section>`;
 type($(".say"),last?`다시 오셨군요. ${last.name}의 계책을 이어서 살펴볼까요?`:"어서 오세요. 오늘은 어느 전투의 계책을 파헤쳐 볼까요?");
 wireChoices(list);
 onAdvance=()=>skipType();
}

/* ===== 연표: 전투를 일어난 해 순서로 놓고, 고르면 기록관이 그 '만약'을 읽어 준다 ===== */
function chronicle(){
 fxLevel=1;onBack=title;onAdvance=()=>skipType();
 let sel=Math.max(0,BATTLE_LIST.findIndex(b=>started(b)&&b.id===BATTLE_ID));
 if(!started(BATTLE_LIST[sel]))sel=BATTLE_LIST.findIndex(b=>b.first);
 app.innerHTML=`<section class="stack">
  <div class="box"><div class="tag">연표 · 『삼국지연의』의 큰 전투</div>
   <ol class="chron" data-nav>${BATTLE_LIST.map((b,i)=>`<li><button class="cnode${b.id?"":" sealed"}" data-i="${i}" aria-pressed="false" aria-label="${b.year}년 ${b.name}, ${statusOf(b)}"><span class="yr">${b.year}</span><span class="hz">${b.hz}</span><span class="nm">${b.name}</span><span class="st">${statusOf(b)}</span></button></li>`).join("")}</ol></div>
  <div class="talk">${archFace}<div class="box dlg chat"><div class="who">기록관</div><div class="say" aria-live="polite"></div><div class="row" id="cgo"></div></div></div>
  <div class="row sb"><button class="btn ghost" id="back">◀ 타이틀</button><span class="dim keyhint" style="font-size:13px">←→ 고르기 · Enter 펼치기 · Esc 타이틀</span></div></section>`;
 const pick=i=>{if(i===sel&&$("#cgo").dataset.i==i)return;sel=i;const b=BATTLE_LIST[i];$("#cgo").dataset.i=i;
  $$(".cnode").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.i===i)));
  type($(".say"),`${b.year}년, ${b.name}. ${b.mission}${b.id?"":" 아직 봉인된 기록입니다."}`);
  $("#cgo").innerHTML=b.id?`<button class="btn" id="open">${started(b)?"이어서 펼치기":"이 기록 펼치기"} ▶</button>`:"";
  if(b.id)$("#open").onclick=()=>enter(b)};
 $$(".cnode").forEach(x=>{const i=+x.dataset.i;x.onfocus=()=>pick(i);x.onclick=()=>pick(i);
  x.onkeydown=e=>{if(e.key==="Enter"&&BATTLE_LIST[i].id){e.preventDefault();enter(BATTLE_LIST[i])}}});
 $("#back").onclick=title;
 pick(sel);$(`.cnode[data-i="${sel}"]`).focus();
}

/* ===== 프롤로그: 이야기와 처음 짐작 ===== */
function prologue(){
 onBack=title;
 const mf=PP[K.q6.mover].f;
 app.innerHTML=`${hud()}<section class="stack">
  <div class="box"><div class="tag">PROLOGUE · ${esc(K.chaptersLabel)}</div><h1 class="logo" style="font-size:clamp(26px,4vw,40px);margin:8px 0">${MISSION}</h1>
   <p style="margin:0">${esc(K.story)}</p>
   <p class="note">${esc(K.storyNote)}</p></div>
  <div class="box vs" aria-label="${esc(SB.name)}과 ${esc(SA.name)}">
   <div class="side"><div class="flags">${flags(SB)}</div><span class="row" style="justify-content:center;gap:6px">${K.vs.b.map(n=>nameTile(n)).join("")}</span><span style="color:var(--side-b)">${esc(SB.name)}</span></div>
   <span class="vsmark">VS</span>
   <div class="side"><div class="flags">${flags(SA)}</div><span class="row" style="justify-content:center;gap:6px">${K.vs.a.map(n=>nameTile(n)).join("")}</span><span style="color:var(--side-a)">${esc(SA.name)}</span></div></div>
  <div class="box move"><div><span class="dim">${esc(K.move.label)}</span><b style="color:${sideColor(mf)}">${esc(K.move.from)}</b></div><span class="big" aria-hidden="true">→</span><div><span class="dim">바꾸어 볼 소속</span><b style="color:${sideColor(K.q6.to)}">${esc(K.move.to)}</b></div></div>
  <div class="box red"><div class="tag">어떤 결과가 나올지 먼저 짐작해 보시겠습니까?</div>
   <div class="opts" id="pred" style="margin-top:10px">${PREDICTIONS.map((p,i)=>`<button class="opt" data-i="${i}" aria-pressed="${S.pred===i}">${p}</button>`).join("")}</div>
   <p class="note">짐작은 마지막에 계산 결과와 비교합니다.</p></div>
  <div class="row sb"><button class="btn ghost" id="back">◀ 타이틀</button><button class="btn" id="go" ${S.pred==null?"disabled":""}>원정 시작 ▶</button></div></section>`;
 wireHud();
 $("#pred").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;S.pred=+b.dataset.i;save();$$("#pred .opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("#go").disabled=false};

/* ★★★ 가정 설계하기: 학습자가 사람·행동·조건을 고르고, 짐작한 뒤 계산하고, 근거를 골라 결론을 쓴다. 정답은 없다 */
function design(){
 const G=K.design,D=S.design=S.design||{};save();fxLevel=1.4;onBack=()=>map();onAdvance=null;
 const ro=roster(),base=idx(null,"env");
 const cand=[...ro].sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,12);
 const otherSide=n=>sideOf(PP[n].f)==="a"?SB.factions[0]:SA.factions[0];
 const mut=()=>({[D.who]:D.act==="out"?null:otherSide(D.who)});
 const actKo=()=>D.act==="out"?"명단에서 빼면":`${sideOf(PP[D.who].f)==="a"?SB.short:SA.short} 쪽으로 옮기면`;
 const condKo=c=>c==="zg"?G.follow:G.env,condShort=c=>c==="zg"?G.followShort:G.envShort;
 const dir=(v,b)=>v<b-2?"down":v>b+2?"up":"same",dirKo={up:"올라간다",same:"비슷하다",down:"내려간다"},dirTo={up:"올라갑니다",same:"거의 그대로입니다",down:"내려갑니다"};
 const ready=()=>D.who&&D.act&&D.cond&&D.guess&&D.conf;
 app.innerHTML=`${hud()}<section class="stack">
  <div class="box qhead"><div class="tag">★★★ 가정 설계하기</div><h1>${esc(G.q)}</h1><p class="note" style="margin:0">지수는 ${esc(SA.short)}${jo(SA.short,"이","가")} 앞서는 정도(0~100)입니다. 지금 명단과 점수로 계산한 기록대로의 값은 <b>${base}</b>입니다.</p></div>
  ${sayBox(G.intro)}
  <section class="step">${stepH(1,"누구를 바꿔 볼까요?")}<div class="box"><div class="opts" id="dwho" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${cand.map(n=>`<button class="opt" data-n="${n}" aria-pressed="${D.who===n}">${nameTile(PP[n].ko)} ${PP[n].ko}<br><span class="dim" style="font-size:13px">${FN[PP[n].f]} · ${scoreOf(n)}점</span></button>`).join("")}</div>
   <div class="row" style="margin-top:12px">${seg("dact",[["move","상대 편으로 옮기기"],["out","명단에서 빼기"]],D.act||"")}</div></div></section>
  <section class="step">${stepH(2,esc(G.condTitle))}<div class="box"><div class="opts" id="dcond"><button class="opt" data-v="env" aria-pressed="${D.cond==="env"}">${esc(G.env)}</button><button class="opt" data-v="zg" aria-pressed="${D.cond==="zg"}">${esc(G.follow)}</button></div></div></section>
  <section class="step">${stepH(3,"계산하기 전에 짐작해 보시지요")}<div class="box"><p style="margin-top:0" id="dq">사람과 조건을 먼저 고르시지요.</p>
   <div class="row">${seg("dguess",[["up","올라간다"],["same","비슷하다"],["down","내려간다"]],D.guess||"")}</div>
   <div class="row" style="margin-top:10px"><span class="dim">얼마나 확신하나요?</span>${seg("dconf",[["3","확실하다"],["2","그런 것 같다"],["1","모르겠다"]],D.conf||"")}</div>
   <p><button class="btn" id="dcalc" disabled>계산하기</button></p></div></section>
  <div id="dres" class="stack"></div>
  <div class="row sb"><button class="btn ghost" id="back">◀ 지도로</button><span class="mission">★★★ 가정 설계하기 · Esc: 지도로</span></div></section>`;
 wireHud();$("#back").onclick=()=>map();
 const sync=()=>{if(D.who&&D.act)$("#dq").textContent=`${PP[D.who].ko}${jo(PP[D.who].ko,"을","를")} ${actKo()}, ${condShort(D.cond||"env")} 지수는 기록대로의 ${base}에서 어떻게 될까요?`;$("#dcalc").disabled=!ready()};
 $("#dwho").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;D.who=b.dataset.n;D.result=0;save();$$("#dwho .opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));sync()};
 onSeg("dact",v=>{D.act=v;D.result=0;save();sync()});
 $("#dcond").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;D.cond=b.dataset.v;D.result=0;save();$$("#dcond .opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));sync()};
 onSeg("dguess",v=>{D.guess=v;save();sync()});onSeg("dconf",v=>{D.conf=v;save();sync()});
 // 점수 규칙을 모두 바꿔 봐도 같은 방향으로 움직이는지
 const robust=(m,c,want)=>{let same=0,all=0;const walk=(i,w)=>{if(i===SKEYS.length){if(SKEYS.some(k=>w[k])){all++;if(dir(C.allyIndex(PP,w,ro,m,c),C.allyIndex(PP,w,ro,null,"env"))===want)same++}return}for(let v=0;v<=5;v++){w[SKEYS[i]]=v;walk(i+1,w)}};walk(0,{});return [same,all]};
 const result=()=>{
  const m=mut(),v=idx(m,D.cond),other=D.cond==="zg"?"env":"zg",v2=idx(m,other),d=dir(v,base),[same,all]=robust(m,D.cond,d);
  const ev=[
   {k:"num",t:`지수: 기록대로 ${base} → ${v} (${verdict(v)}), ${dirTo[d]}`},
   {k:"num",t:`같은 바꾸기라도 ${condShort(other)} 지수는 ${v2} (${verdict(v2)})입니다.`},
   {k:"num",t:`점수 규칙 ${all}가지 중 ${same}가지에서 같은 방향으로 움직입니다.`},
   {k:"limit",t:G.limit},
   {k:"over",t:`그러므로 ${PP[D.who].ko}${jo(PP[D.who].ko,"이","가")} 바뀌었다면 실제 승패도 바뀌었을 것입니다.`}];
  $("#dres").innerHTML=`<section class="step">${stepH(4,"계산 결과")}<div class="box"><div id="g7">${gaugeHTML(v,base)}</div>
    <p class="big" style="margin-bottom:0">${base} → <span style="color:var(--gold)">${v}</span></p>
    <p class="note">짐작: ${dirKo[D.guess]} (${{3:"확실하다",2:"그런 것 같다",1:"모르겠다"}[D.conf]}) · 결과: ${dirKo[d]}. ${D.guess===d?"짐작과 같은 방향입니다.":"짐작과 다른 방향입니다. 어디서 달라졌는지 아래 근거에서 찾아보시지요."}</p></div></section>
   <section class="step">${stepH(5,"근거를 골라 결론을 쓰시지요")}<div class="box"><p class="note" style="margin-top:0">정답은 없습니다. 숫자 근거를 하나 이상, 한계를 하나 골라야 결론을 저장할 수 있습니다.</p>
    <div class="opts" id="dev">${ev.map((x,k)=>`<button class="opt" data-k="${k}" aria-pressed="${(D.ev||[]).includes(k)}">${esc(x.t)}</button>`).join("")}</div><p class="fb bad" id="dwarn" hidden></p>
    <p><button class="btn" id="dsave" disabled>결론 저장하기</button></p><div id="dconc"></div></div></section>`;
  D.result=1;save();
  const check=()=>{const pick=(D.ev||[]).map(k=>ev[k]),over=pick.some(x=>x.k==="over"),ok=pick.some(x=>x.k==="num")&&pick.some(x=>x.k==="limit")&&!over;
   const w=$("#dwarn");w.hidden=!over;if(over)w.innerHTML=`<b>다시 생각해 보시지요.</b> 이 지수는 기록에 나온 횟수로 만든 숫자입니다. 지수가 바뀐다고 실제 승패가 바뀐다고 말할 수는 없습니다.`;
   $("#dsave").disabled=!ok;return pick};
  $("#dev").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const k=+b.dataset.k;D.ev=(D.ev||[]).includes(k)?D.ev.filter(x=>x!==k):[...(D.ev||[]),k].sort();b.setAttribute("aria-pressed",String(D.ev.includes(k)));save();check()};
  $("#dsave").onclick=()=>{const pick=check();D.text=`${PP[D.who].ko}${jo(PP[D.who].ko,"을","를")} ${actKo()}, ${condShort(D.cond)}의 결과입니다. `+pick.map(x=>x.t.replace(/([^.])$/,"$1.")).join(" ");D.done=1;save();
   $("#dconc").innerHTML=`<div class="box gold" style="margin-top:12px"><div class="tag">내 결론</div><p style="margin:8px 0 0">${esc(D.text)}</p></div>${named("가정 설계",`무엇을 바꿀지, 어떤 조건에서 볼지 스스로 정하고, 결과를 숫자 근거와 한계와 함께 적었습니다. 실무에서는 이렇게 가정을 바꿔 결과를 비교하는 일을 시나리오 분석이라고 합니다.`)}<p><button class="btn" id="ddone">지도로 ▶</button></p>`;$("#ddone").onclick=()=>map()};
  check();if(D.done&&D.text)$("#dsave").click()};
 $("#dcalc").onclick=result;
 sync();if(D.result&&ready())result();
}

/* ===== 지표 타당도: 기록 점수가 실제 승패와 맞았나 =====
   이 점수는 '기록에 이름과 글자가 얼마나 함께 나왔나'(서사 비중)를 잰다. 승패를 재는 지표인지 결과와 견주어 본다 */
function validityBox(base){
 const W=BATTLE.winner==="a"?SA:SB,lead=base>55?SA:base<45?SB:null,ok=lead===W;
 const say=lead?`기록 점수로는 <b>${esc(lead.short)}${jo(lead.short,"이","가")} 앞섭니다</b>(${base}).`:`기록 점수로는 두 편이 <b>비슷합니다</b>(${base}).`;
 const others=BATTLE_LIST.filter(b=>b.id&&b.id!==BATTLE_ID).map(b=>`<a href="?b=${b.id}">${b.hz} ${b.name}</a>`).join(" · ");
 return `<div class="box"><div class="tag">지표 타당도 · 이 점수는 실제 승패와 맞았을까요?</div>
  <p style="margin:8px 0 0">${say} 『삼국지연의』에서 실제로 이긴 편은 <b>${esc(W.name)}</b>입니다. ${ok
   ?"지표와 결과가 맞았습니다. 다만 점수에 쓴 글자는 이 싸움의 결과를 알고 고른 것이라, 맞았다는 사실만으로 이 지표가 승패를 잰다고 말할 수는 없습니다."
   :"지표와 결과가 어긋났습니다. 이 점수는 승패가 아니라 '누가 기록에 얼마나 많이 나왔나'를 잽니다. 이긴 편보다 진 편이 이야기에 더 많이 나올 수도 있습니다."}</p>
  <p class="note">실무에서는 이것을 '지표 타당도 확인'이라고 합니다. 만든 지표가 재려던 것을 정말 재는지, 결과를 이미 아는 사례에 대어 봅니다.${others?` 다른 전투에서도 견주어 보시지요: ${others}`:""}</p></div>`;
}

addEventListener("keydown",ev=>{
 if(ev.key==="Escape"&&onBack){const f=onBack;onBack=null;f();return}
 const nav=$("[data-nav]");
 if(nav&&/^Arrow/.test(ev.key)&&!ev.target.closest("input")){const b=[...nav.querySelectorAll("button")],i=b.indexOf(document.activeElement);
  b[i<0?0:(i+(/Down|Right/.test(ev.key)?1:-1)+b.length)%b.length].focus();ev.preventDefault();return}
 if((ev.key==="Enter"||ev.key===" ")&&onAdvance&&!ev.target.closest("button,a,summary,input")){ev.preventDefault();onAdvance()}
});
addEventListener("click",ev=>{if(ev.target.closest(".dlg, .face")&&onAdvance)onAdvance()});

/* ===== 불길 배경: prototype/red-cliff-lab/src/50-fx.js 의 fire 모드를 오른쪽 아래에 은은하게 ===== */
(function(){
 const cv=$("#fx"),ctx=cv.getContext("2d");let w,h;const dpr=Math.min(2,devicePixelRatio||1);
 const size=()=>{w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener("resize",size);
 const rnd=(a,b)=>a+Math.random()*(b-a);let lv=1;
 const P=[...Array(70)].map(()=>({x:rnd(.5,1),y:rnd(0,1.2),r:rnd(.6,2),vy:rnd(.00025,.0008),vx:rnd(-.0002,.0002),ph:rnd(0,6.28)}));
 function draw(t){
  lv+=(fxLevel-lv)*.03;ctx.clearRect(0,0,w,h);
  const g=ctx.createRadialGradient(w*.85,h*1.08,0,w*.85,h*1.08,Math.max(w,h)*(.5+.1*lv));
  g.addColorStop(0,`rgba(226,98,43,${.22+.08*lv})`);g.addColorStop(.5,`rgba(140,42,30,${.06+.04*lv})`);g.addColorStop(1,"rgba(140,42,30,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const n=Math.round(30*lv);
  for(let k=0;k<Math.min(n,P.length);k++){const p=P[k];
   p.y-=p.vy*(.8+.3*lv);p.x+=p.vx+Math.sin(t/700+p.ph)*.0004;if(p.y<.2){p.y=1.05;p.x=rnd(.5,1)}
   const life=Math.max(0,Math.min(1,p.y));
   ctx.fillStyle=`rgba(255,${150+Math.round(60*(1-life))},70,${(.1+.5*life)*Math.min(1,(p.y-.2)*3)})`;
   ctx.fillRect(Math.round(p.x*w),Math.round(p.y*h),Math.ceil(p.r*1.5),Math.ceil(p.r*1.5)); // 네모 불티로 도트 느낌
  }
 }
 const loop=t=>{if(!document.hidden)draw(t);requestAnimationFrame(loop)};
 if(RM)draw(0);else requestAnimationFrame(loop);
})();

if(new URLSearchParams(location.search).has("go")){history.replaceState(null,"",`?b=${BATTLE_ID}`);enter(BATTLE_LIST.find(b=>b.id===BATTLE_ID))}else title();
