<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계책록 — 제갈량이 조조 편이었다면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
/* 색은 맡은 일이 하나씩: 금색=지금 할 일, 위·오·촉 색=세력, 나머지는 무채색.
   --line은 기본 테두리(차분하게), --red는 위 세력과 같은 색이라 세력 표시 밖에서는 쓰지 않는다. */
:root{--bg:#0f1114;--grid:rgba(255,255,255,.018);--card:#171a1e;--line:#3f444b;--line-hi:#6a6f77;--ink:#f1ebde;--dim:#b9b1a1;--red:#d6463c;--gold:#e8b030;--wei:#d6463c;--wu:#4a90c2;--shu:#5c9a5a;--ally:#4a90c2;--px:"Galmuri11","Galmuri9",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 16px 80px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.px{font-family:var(--px)}
.box{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:20px 22px}
.box.gold{border-color:var(--gold)}.box.red{border-color:var(--line-hi)}
.tag{font-size:13px;font-weight:700;color:var(--gold)}
.logo{font-family:var(--px);font-weight:700;color:var(--gold);text-shadow:4px 4px 0 #000;line-height:1.15}
.dim{color:var(--dim)}
.num{font-family:var(--px);font-variant-numeric:tabular-nums}
.btn{font-family:var(--px);background:var(--gold);color:#1a1205;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 18px;font-size:15px;text-decoration:none;display:inline-block}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
[hidden]{display:none!important}
.stack{display:grid;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
img.spr{image-rendering:pixelated;display:block}

/* 대화창 */
.dlg{position:relative;padding:14px 20px 22px;min-height:88px;cursor:pointer}
.dlg .who{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px}
.dlg .say{font-size:16px;min-height:1.6em}
.dlg .more{position:absolute;right:14px;bottom:10px;width:12px;height:8px;background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.talk{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:end}
.face{aspect-ratio:1;display:grid;place-items:center;padding:0;overflow:hidden;background:#1b2530;font-family:var(--px);font-size:52px;color:var(--ink)}
.face img{width:160%;max-width:none}
.face img.pt,.portrait img.pt{width:100%;max-width:100%;image-rendering:pixelated}
.pcard .pt{width:64px;height:64px;border:2px solid var(--line);image-rendering:pixelated}

/* 타이틀 */
.title{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:82vh}
.title .logo{font-size:clamp(56px,9vw,104px)}
.title h2{font-family:var(--px);font-size:22px;margin:16px 0 4px}
.portrait{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;padding:0;background:#1b2530}
.portrait img{width:125%;max-width:none}
.press{font-family:var(--px);color:var(--gold);animation:blink 1.2s steps(2) infinite;margin-top:18px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.hud .logo{font-size:26px;text-shadow:3px 3px 0 #000;background:none;border:0;padding:0}
.stats{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;align-items:center}
.bar{display:inline-block;width:130px;height:12px;border:2px solid var(--line);vertical-align:middle;margin-left:6px;background:#000}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s steps(6)}
.tools{display:inline-flex;gap:4px}
.tl{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);font-family:"Noto Serif KR","Batang",serif;font-size:14px;opacity:.3}
.tl.on{opacity:1;border-color:var(--gold);color:var(--gold);background:#000}
.tool-get{display:flex;gap:12px;align-items:center;justify-content:center;margin:10px 0 0}
.tool-get .tl{width:44px;height:44px;font-size:24px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;padding:0;list-style:none}
.skills li{display:flex;gap:10px;align-items:center}
.skills .tl{width:36px;height:36px;font-size:20px;flex:none}

/* 프롤로그 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs .side{display:grid;justify-items:center;gap:6px;font-family:var(--px)}
.vs .side img{width:min(260px,100%)}
.vs .vsmark{font-family:var(--px);font-size:34px;color:var(--gold);text-shadow:3px 3px 0 #000}
.flip{transform:scaleX(-1)}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);padding:10px 14px;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--line-hi);background:#20242a}
.opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(232,176,48,.12)}
.opt:hover::before,.opt[aria-pressed="true"]::before{content:"▶ "}
.opt.ok{background:var(--gold);color:#111;border-color:var(--gold)}
.opt.no{border-style:dashed;border-color:var(--line-hi);color:var(--dim);background:transparent}
.move{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;font-family:var(--px)}
.move b{display:block;font-size:18px;margin-top:4px}

/* 지도 */
.map{position:relative;padding:26px 22px 22px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nodes{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:190px}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;color:var(--dim)}
.node .sq{position:relative;z-index:1;width:30px;height:30px;background:var(--line);border:3px solid #000;box-shadow:3px 3px 0 #000}
.node.now .sq{background:var(--gold);animation:bob 1s steps(2) infinite}
.node.clear .sq{background:var(--ink)}
.node.lock{cursor:not-allowed;opacity:.45}
.node.now,.node.clear{color:var(--ink)}
.node:focus-visible .sq{outline:3px dashed var(--gold);outline-offset:5px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* 퀘스트 공통 */
.qhead h1{font-family:var(--px);font-size:clamp(22px,3.2vw,34px);color:var(--ink);text-shadow:3px 3px 0 #000;margin:8px 0 10px;line-height:1.35}
.concept{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.concept b{color:var(--gold)}
.mission{font-size:13px;color:var(--dim)}
.step{display:grid;gap:12px}
.step>h2{font-family:var(--px);font-size:17px;display:flex;gap:10px;align-items:center}
.step>h2 .sno{background:var(--gold);color:#111;padding:2px 8px;font-size:12px}
.named{border-color:var(--gold)}
.named .tag{color:#111;background:var(--gold);padding:2px 8px;display:inline-block}
.named h3{font-family:var(--px);font-size:18px;margin:10px 0 6px;color:var(--gold)}
.named p{margin:0}
.big{font-family:var(--px);font-size:28px}
.note{color:var(--dim);font-size:14px;margin:8px 0 0}
.fb{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--gold);background:rgba(232,176,48,.08)}
.fb.bad{border-color:var(--line-hi);background:rgba(255,255,255,.04)}
.shake{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}

/* 1: 인물 카드 */
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pcard{display:grid;gap:8px;align-content:start;padding:16px}
.pcard h3{font-family:var(--px);font-size:18px;display:flex;gap:8px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border:2px solid currentColor}
.chip.wei{color:var(--wei)}.chip.wu{color:var(--wu)}.chip.shu{color:var(--shu)}
.pcard .fact{font-size:13px;color:var(--dim);margin:0}
.pcard .pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pcard .pick button{border:2px solid var(--line);background:transparent;padding:6px 4px;font-size:13px}
.pcard .pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#111}
.pcard .tip{font-size:13px;margin:0;color:var(--ink)}
.pcard.in{border-color:var(--gold)}.pcard.out{opacity:.7;border-style:dashed}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side-n{display:grid;gap:2px;padding:14px;border:3px solid var(--line)}
.side-n.wei{border-color:var(--wei)}.side-n.ally{border-color:var(--ally)}
.side-n b{font-family:var(--px);font-size:34px}
.seg{display:inline-flex;border:2px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#111}

/* 막대 */
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:5.5em 1fr 3.5em;gap:10px;align-items:center;font-size:14px}
.brow .track{position:relative;height:18px;background:#000;border:2px solid #333}
.brow .fill{display:block;height:100%;transition:width .5s steps(8)}
.brow.out{opacity:.3}
.brow .avgm{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--gold);transition:left .5s steps(8)}
.brow b{font-family:var(--px);text-align:right}

/* 줄다리기 */
.tug{display:grid;gap:8px}
.tug .nums{display:flex;justify-content:space-between;font-family:var(--px);font-size:14px}
.tug .nums b{font-size:22px}
.tug .rope{display:flex;height:26px;border:3px solid var(--line);background:#000;position:relative}
.tug .rope i{display:block;height:100%;transition:width .5s steps(10)}
.tug .rope .w{background:var(--wei)}.tug .rope .a{background:repeating-linear-gradient(90deg,var(--wu) 0 12px,var(--shu) 12px 24px)}
.tug .rope::after{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:3px;background:var(--gold)}
.stepper{display:grid;gap:10px}
.stepper .w{display:grid;grid-template-columns:5em auto;gap:10px;align-items:center;font-family:var(--px)}
.stepper .ctl{display:inline-flex;align-items:center;border:2px solid var(--line)}
.stepper .ctl button{border:0;background:transparent;width:34px;height:32px;font-family:var(--px);font-size:16px}
.stepper .ctl button:hover{background:#20242a}
.stepper .ctl output{min-width:3.4em;text-align:center}
.pips{display:inline-flex;gap:3px;margin-left:8px}.pips i{width:10px;height:10px;background:#333}.pips i.on{background:var(--gold)}
.kcount{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kcount div{border:2px solid var(--line);padding:12px;display:grid}
.kcount b{font-family:var(--px);font-size:30px;color:var(--gold)}
.kcount span{font-size:13px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}

/* 4: 와플 */
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.waffle{display:grid;grid-template-columns:repeat(36,1fr);gap:3px;margin-top:12px}
.waffle i{aspect-ratio:1;background:#222;animation:pop .01s steps(1) backwards;animation-delay:calc(var(--k)*8ms)}
.waffle i.a{background:var(--ally)}.waffle i.w{background:var(--wei)}
@keyframes pop{from{opacity:0}}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin-top:8px}
.key i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}

/* 5: 원문 */
blockquote.ev{margin:12px 0 0;padding:14px 16px;border:2px dashed var(--line);background:#0a0b0d;font-size:15px;line-height:1.8}
.kw{color:#111;background:var(--gold);padding:0 2px}

/* 6: 전장 */
.arena{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:end;gap:8px;text-align:center}
.arena img{width:100%;max-width:240px;margin:0 auto}
.arena .lbl{font-size:13px;font-weight:700}
.gauge{display:grid;gap:8px}
.gauge .head{display:flex;justify-content:space-between;align-items:baseline}
.gauge .v{font-family:var(--px);font-size:40px;color:var(--gold)}
.gauge .verd{font-family:var(--px)}
.gauge .trk{position:relative;height:26px;border:3px solid var(--line);background:linear-gradient(90deg,rgba(79,127,214,.35),transparent 45%,transparent 55%,rgba(217,80,63,.35))}
.gauge .pin{position:absolute;top:-10px;width:8px;height:40px;background:var(--gold);border:2px solid #000;transform:translateX(-50%);transition:left .7s steps(14)}
.gauge .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);opacity:.5}
.gauge .ghost{position:absolute;top:2px;width:6px;height:16px;background:var(--dim);transform:translateX(-50%)}
.gauge .sc{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

/* 한자 이름 패와 깃발 (인물 그림 대신) */
.hz{display:inline-grid;place-items:center;font-family:"Noto Serif KR","Batang",serif;font-weight:700;font-size:18px;padding:4px 8px;border:3px solid var(--line);background:#0a0b0d;color:var(--ink);box-shadow:3px 3px 0 #000;letter-spacing:.06em;line-height:1.1}
.hz.wei{border-color:var(--wei)}.hz.wu{border-color:var(--wu)}.hz.shu{border-color:var(--shu)}
.hz.big{width:100%;height:100%;border:0;box-shadow:none;background:transparent;font-size:clamp(26px,3.4vw,40px);writing-mode:vertical-rl;padding:0}
.face:has(.hz.wei){background:#2a1214}.face:has(.hz.wu){background:#10202e}.face:has(.hz.shu){background:#132219}
.pcard .hz{justify-self:start}
.flags{display:flex;justify-content:center;gap:4px;transition:opacity .3s}
.flag{width:100%;max-width:200px;image-rendering:pixelated;display:block}
.flags .flag+.flag{margin-left:-8%}
.flags.win{animation:rally .4s steps(2) 3}
.flags.lose{opacity:.45;filter:grayscale(.6)}
@keyframes rally{50%{transform:translateY(-8px) scale(1.04)}}
.vs .side .flag{max-width:180px}
.arena .flags .flag{max-width:130px}
.zg-token{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}
.zg-token .hz{border-color:var(--ally);transition:transform .6s steps(6)}
.zg-token.to-wei .hz{border-color:var(--wei);animation:hop .6s steps(3)}
@keyframes hop{50%{transform:translateY(-12px)}}
.clear-pt{width:160px!important;border:3px solid var(--line);margin:4px auto}

/* 확인 문제 */
.quiz h2{font-family:var(--px);font-size:16px;margin:6px 0 12px}

/* 결과 창 */
.pop{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:rgba(0,0,0,.6);padding:16px}
.pop .box{text-align:center;padding:28px 32px;max-width:520px}
.pop .logo{font-size:52px}
.pop img{width:220px;margin:0 auto}
.report{display:grid;gap:16px}
.report ol{margin:0;padding-left:1.4em;display:grid;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{border:3px solid var(--line);padding:14px}
.cmp b{font-family:var(--px);display:block;font-size:17px;margin-top:4px}

@media (max-width:760px){
 .title{grid-template-columns:1fr;gap:22px;min-height:auto;padding-top:12px}
 .portrait{max-width:240px}
 .pcards{grid-template-columns:1fr 1fr}
 .friends,.cols,.cmp,.kcount{grid-template-columns:1fr}
 .nodes{grid-template-columns:repeat(3,1fr);height:auto;row-gap:24px}
 .map svg{display:none}
 .node{padding-top:0!important}
 .kcount{grid-template-columns:repeat(3,1fr)}
 .talk{grid-template-columns:80px 1fr}.face{font-size:32px}
 .bar{width:80px}
 .waffle{grid-template-columns:repeat(18,1fr)}
 .arena{grid-template-columns:1fr 1fr}.arena .gauge{grid-column:1/-1;order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.waffle i{opacity:1}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="app"></main>

<!-- 실제 프로토타입과 같은 데이터(『삼국지연의』 43~50회 집계)를 그대로 씁니다 -->
<script src="../red-cliff-lab/src/30-data.js"></script>
<script src="core.js"></script>
<script>
/* ===== 데이터와 계산: 계산은 core.js, 여기서는 화면 상태(S)를 넘기는 연결만 ===== */
const PP=Core.people(DB);
const NAMES=DB.map(r=>r[0]);
const DEAD=Core.DEAD;
const FN={wei:"위",wu:"오",shu:"촉"};
const {avg,median}=Core;
const f1=x=>Number.isInteger(x)?String(x):x.toFixed(1);
const fresh=()=>({rule:{min:2,dead:1},w:{ship:3,fire:3,plan:2},done:{},t:{},pred:null,stage:0});
/* 퀘스트를 마치면 얻는 도구. 도구 하나가 분석 기술 하나다. pro는 보고서에서만 보여 주는 실무 용어 */
const TOOLS=[
 {ch:"筆",name:"붓",does:"셀 대상 정하기",pro:"분석 대상 정의 · 필터"},
 {ch:"算",name:"주판",does:"모아 세고 대표값 구하기",pro:"집계 · 평균과 중앙값"},
 {ch:"衡",name:"저울",does:"기록에 무게 달기",pro:"지표 설계 · 가중치"},
 {ch:"篩",name:"체",does:"규칙을 바꿔 걸러 보기",pro:"민감도 분석"},
 {ch:"鏡",name:"돋보기",does:"숫자 뒤의 원문 보기",pro:"근거 확인 · 타당도"},
 {ch:"扇",name:"부채",does:"조건 하나 바꿔 보기",pro:"What-if 시뮬레이션 · 가정"}];
const toolTile=(i,on)=>`<span class="tl${on?" on":""}" aria-hidden="true">${TOOLS[i].ch}</span>`;
let S=fresh();try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem("gyechaek-zg")||"{}"))}catch{}
const save=()=>{try{localStorage.setItem("gyechaek-zg",JSON.stringify(S))}catch{}};
const roster=()=>Core.roster(PP,S.rule);
const scoreOf=(n,w=S.w)=>Core.score(PP,n,w);
const fs=(w=S.w,r=roster(),mut)=>Core.factionScores(PP,w,r,mut);
const facMembers=f=>roster().filter(n=>PP[n].f===f);
const MOVED={"諸葛亮":"wei"};
const idx=(mut,wmode)=>Core.allyIndex(PP,S.w,roster(),mut,wmode);
const verdict=Core.verdict;

/* ===== 화면 도우미 ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-44032;return c>=0&&c<11172&&c%28?a:b};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* 이미지는 기록관 그림과 세력 깃발만 씁니다. 그 밖의 인물은 한자 이름 패로 표시합니다. */
const FLAG_DIR="../../frontend/public/sprites/factions/";
const FLAG_KO={wei:"위",wu:"오",shu:"촉"};

 $("#run").onclick=run;if(S.t.win!=null)run();
};

/* 5. 원문 확인 */
ACT[4]=(el,unlock)=>{
 const top=roster().map(n=>({n,v:PP[n].yy[1]})).sort((a,b)=>b.v-a.v).slice(0,4),e=(EVID["曹操"]||{}).fire;
 const ASK={opts:["불을 지르는 쪽입니다.","원문만으로는 알 수 없습니다.","불에 당해 달아나고 있습니다."],ok:2,good:"조조는 불에 당하고 있습니다. 그래도 ‘불’ 글자가 함께 나와서 점수가 높아졌습니다.",bad:"원문에서 조조가 무엇을 하고 있는지 읽어 보시지요."};
 el.innerHTML=`<section class="step">${stepH(1,"'불' 글자와 함께 나온 횟수")}<div class="box">${barsHTML(top.map(x=>({label:PP[x.n].ko,v:x.v,c:`var(--${PP[x.n].f})`})),top[0].v,"회")}<p class="note">조조의 '불' 숫자가 가장 높습니다. 조조가 불을 잘 다뤘다는 뜻일까요?</p></div></section>
  <section class="step">${stepH(2,"원문을 먼저 읽어 보시지요")}<div class="box"><button class="btn" id="open">📜 원문 펼치기</button><div id="txt"></div></div></section>
  <section class="step" id="ask" hidden>${stepH(3,"조조는 불을 잘 다뤘을까요?")}<div class="box"><div class="opts" id="aopts">${ASK.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div><p class="fb" id="afb" hidden></p></div></section><div id="n5"></div>`;
 const open=()=>{$("#open").hidden=true;$("#txt").innerHTML=e?`<p class="note" style="margin-top:0">『삼국지연의』 ${e[0]}회 · 조조와 '불'이 함께 나온 문단</p><blockquote class="ev">${hiKw(e[1],/불(?![러렀구과평만안편어었])/g)}</blockquote>`:"";$("#ask").hidden=false;S.t.opened=1;save()};
 $("#open").onclick=open;
 $("#aopts").onclick=ev=>{const b=ev.target.closest(".opt");if(!b)return;const k=+b.dataset.k,fb=$("#afb");fb.hidden=false;$$("#aopts .opt").forEach(x=>x.classList.remove("ok","no"));
  if(k===ASK.ok){b.classList.add("ok");fb.className="fb";fb.innerHTML=`<b>맞습니다.</b> ${ASK.good}`;S.t.read=1;save();$("#n5").innerHTML=named("근거 확인","뜻밖의 숫자가 나왔다면, 그 숫자가 비롯된 기록을 직접 펼쳐 보시지요. 글자를 세는 방법은 '불을 지른 사람'과 '불에 당한 사람'을 구분하지 못했습니다.");unlock()}
  else{b.classList.add("no");fb.className="fb bad";fb.innerHTML=`<b>다시 생각해 보시지요.</b> ${ASK.bad}`}};
 if(S.t.opened)open();
};

/* 6. 제갈량 옮기기 + 바람 가정 */
ACT[5]=(el,unlock)=>{
 const D=S.t.d6=S.t.d6||{tried:[]},base=idx(null,"env");
 el.innerHTML=`<section class="step">${stepH(1,"지금 기록대로 계산하면")}<div class="box">
   <div class="arena"><div><div class="flags" id="aw">${flag("wei")}</div><div class="lbl" style="color:var(--wei)">조조군</div></div>
   <div id="g6">${gaugeHTML(base)}</div>
   <div><div class="flags" id="aa">${flag("wu")}${flag("shu")}</div><div class="lbl" style="color:var(--ally)">손권·유비 연합군</div></div></div>
   <div class="zg-token" id="zg">${nameTile("제갈량")}<span class="dim">제갈량 · 지금 소속: <b id="zgside" style="color:var(--ally)">연합군</b></span></div>
   <p class="note">앞 순서에서 정한 명단과 점수로 계산한 '연합군이 앞서는 정도'(0~100)입니다. 바람은 날씨로 보아 연합군에 +10을 더했습니다.</p>
   <p><button class="btn" id="mv">⚑ 제갈량을 조조 편으로 옮기기</button></p><div id="mvres"></div></div></section>
  <section class="step" id="w6" hidden>${stepH(2,"그런데 바람은 누가 불게 했을까요?")}<div class="box"><div class="opts" id="wopts"><button class="opt" data-v="env">바람은 환경 조건입니다 (날씨)</button><button class="opt" data-v="zg">바람이 제갈량을 따라갑니다</button></div><div id="wres"></div></div></section>
  <div id="n6"></div>`;
 const anim=i=>duel("#aw","#aa",i<45?"wei":i>=65?"ally":"tie");
 const setG=(i,ghost)=>{$("#g6").innerHTML=gaugeHTML(ghost??i,ghost);requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$("#g6");if(!g)return;g.querySelector(".pin").style.left=i+"%";g.querySelector(".v").textContent=i;g.querySelector(".verd").textContent=verdict(i)}));anim(i)};
 const moved=()=>{const m=idx(MOVED,"env");$("#mv").hidden=true;setG(m,base);
  const zs=$("#zgside");zs.textContent="조조군";zs.style.color="var(--wei)";$("#zg").classList.add("to-wei");
  $("#mvres").innerHTML=`<p class="big">${base} → <span style="color:var(--gold)">${m}</span></p><p class="note">제갈량의 점수가 조조군으로 옮겨 갔습니다. 바람은 그대로 연합군 편이라고 두었습니다.</p>`;$("#w6").hidden=false;S.t.moved=1;save();drawWind(true)};
 const drawWind=quiet=>{$$("#wopts .opt").forEach(b=>b.setAttribute("aria-pressed",String(D.w===b.dataset.v)));if(!D.w)return;
  const v=idx(MOVED,D.w);if(!quiet)setG(v,base);
  $("#wres").innerHTML=`<p class="big" style="margin-bottom:0">${v} · ${verdict(v)}</p><p class="note">${D.w==="zg"?"제갈량이 바람을 부른다면, 바람도 조조군 편으로 붑니다.":"바람이 그냥 날씨라면, 제갈량이 옮겨 가도 바람은 그대로 연합군 편입니다."}${D.tried.length<2?" 다른 가정도 눌러 보시지요.":""}</p>`;
  if(D.tried.length>=2){const e=idx(MOVED,"env"),z=idx(MOVED,"zg");
   $("#n6").innerHTML=named("가정 실험과 전제",`같은 '제갈량 이동'인데도 바람을 날씨로 보면 <b>${e}</b>(${verdict(e)}), 제갈량이 불렀다고 보면 <b>${z}</b>(${verdict(z)})입니다. 결과는 어떤 가정을 하느냐에 달려 있습니다. 그래서 가정 실험의 답에는 항상 가정을 함께 적습니다.`);unlock()}};
 $("#mv").onclick=moved;
 $("#wopts").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;D.w=b.dataset.v;if(!D.tried.includes(D.w))D.tried.push(D.w);save();drawWind()};
 if(S.t.moved)moved();
};

/* ===== 계책 보고서: 처음 짐작과 결과 비교 ===== */
function report(){
 fxLevel=2;onBack=()=>map();
 const e=idx(MOVED,"env"),z=idx(MOVED,"zg"),base=idx(null,"env");
 const caoUp=z<base||e<base;
 const predTxt=S.pred!=null?PREDICTIONS[S.pred]:"남긴 예상이 없습니다";
 app.innerHTML=`${hud()}<section class="report">
  <div class="box gold"><div class="tag">계책 보고서 · ${MISSION}</div><h1 class="logo" style="font-size:clamp(26px,4vw,40px);margin:8px 0">원정 완료!</h1>
   <div class="arena" style="grid-template-columns:auto 1fr;max-width:620px;align-items:center;text-align:left;gap:20px"><img class="pt" src="${ARCHIVIST}" alt="기록관" style="width:140px;border:3px solid var(--line)"><p style="margin:0">여섯 장의 기록을 모았습니다. 처음 짐작과 계산 결과를 견주어 보시지요.</p></div></div>
  <div class="cmp"><div><span class="dim">처음 짐작</span><b>${esc(predTxt)}</b></div><div style="border-color:var(--gold)"><span class="dim">계산 결과 (연합군이 앞서는 정도)</span><b>기록대로 ${base} → 바람=날씨 ${e} · 바람=제갈량 ${z}</b></div></div>
  <div class="box"><div class="tag">해석</div><p style="margin:8px 0 0">${caoUp?"제갈량을 옮기면 조조군 쪽으로 기울지만, ":""}바람을 날씨로 보면 <b>${verdict(e)}</b>, 제갈량이 바람을 불렀다고 보면 <b>${verdict(z)}</b>입니다. 같은 이동이라도 바람에 관한 가정에 따라 결론이 달라집니다.</p><p class="note">${REPORT_LIMIT}</p></div>
  <div class="box"><div class="tag">얻은 도구와 익힌 분석 기술</div><ul class="skills">${TOOLS.map((t,k)=>`<li>${toolTile(k,S.done[k+1])}<div><b class="px">${t.name}</b> · ${t.does}<br><span class="dim">실무에서는: ${t.pro}</span></div></li>`).join("")}</ul></div>
  <div class="box"><div class="tag">순서별로 남긴 기록</div><ol style="margin-top:10px">${STAGES.map((s,k)=>`<li><b class="px">${esc(s.short)}</b><br><span class="dim">${esc(S.done[k+1]||"아직 하지 않음")}</span></li>`).join("")}</ol></div>
  <div class="row"><button class="btn" id="again">처음부터 다시 하기</button><button class="btn ghost" id="tomap">지도로</button><a class="btn ghost" href="../../frontend/public/learning/index.html">실제 실습 화면 열기</a></div></section>`;
 wireHud();
 $("#again").onclick=()=>{S=fresh();save();title()};$("#tomap").onclick=()=>map();
 onAdvance=null;
}

/* ===== 키보드 ===== */
addEventListener("keydown",ev=>{
 if(ev.key==="Escape"&&onBack){const f=onBack;onBack=null;f();return}
 if((ev.key==="Enter"||ev.key===" ")&&onAdvance&&!ev.target.closest("button,a,summary,input")){ev.preventDefault();onAdvance()}
});
addEventListener("click",ev=>{if(ev.target.closest(".dlg, .title .press, .portrait")&&onAdvance)onAdvance()});

/* ===== 불길 배경: prototype/red-cliff-lab/src/50-fx.js 의 fire 모드를 오른쪽 아래에 은은하게 ===== */
(function(){
 const cv=$("#fx"),ctx=cv.getContext("2d");let w,h;const dpr=Math.min(2,devicePixelRatio||1);
 const size=()=>{w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener("resize",size);
 const rnd=(a,b)=>a+Math.random()*(b-a);let lv=1;
 const P=[...Array(70)].map(()=>({x:rnd(.5,1),y:rnd(0,1.2),r:rnd(.6,2),vy:rnd(.00025,.0008),vx:rnd(-.0002,.0002),ph:rnd(0,6.28)}));
 function draw(t){
  lv+=(fxLevel-lv)*.03;ctx.clearRect(0,0,w,h);
  const g=ctx.createRadialGradient(w*.85,h*1.08,0,w*.85,h*1.08,Math.max(w,h)*(.5+.1*lv));
  g.addColorStop(0,`rgba(226,98,43,${.22+.08*lv})`);g.addColorStop(.5,`rgba(140,42,30,${.06+.04*lv})`);g.addColorStop(1,"rgba(140,42,30,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const n=Math.round(30*lv);
  for(let k=0;k<Math.min(n,P.length);k++){const p=P[k];
   p.y-=p.vy*(.8+.3*lv);p.x+=p.vx+Math.sin(t/700+p.ph)*.0004;if(p.y<.2){p.y=1.05;p.x=rnd(.5,1)}
   const life=Math.max(0,Math.min(1,p.y));
   ctx.fillStyle=`rgba(255,${150+Math.round(60*(1-life))},70,${(.1+.5*life)*Math.min(1,(p.y-.2)*3)})`;
   ctx.fillRect(Math.round(p.x*w),Math.round(p.y*h),Math.ceil(p.r*1.5),Math.ceil(p.r*1.5)); // 네모 불티로 도트 느낌
  }
 }
 const loop=t=>{if(!document.hidden)draw(t);requestAnimationFrame(loop)};
 if(RM)draw(0);else requestAnimationFrame(loop);
})();

title();
</script>
